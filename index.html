                        const personalShare = selectedPerson && sharePeople.includes(selectedPerson) ? Number(b.amount || 0) / Math.max(1, sharePeople.length) : 0;
                        const personalPaid = selectedPerson ? billPayers(b).filter(p=>p.person===selectedPerson).reduce((sum,p)=>sum+Number(p.amount||0),0) : 0;
                        const shownAmount = selectedPerson ? personalShare : Number(b.amount || 0);
                        return <div key={b.id} onTouchStart={event=>{billTouchStart.current=event.touches[0].clientX;}} onTouchEnd={event=>{const delta=event.changedTouches[0].clientX-billTouchStart.current;if(delta<-35)setOpenBillId(b.id);if(delta>35)setOpenBillId(null);}} className="relative overflow-hidden rounded-card shadow-sm min-w-0"><div className="absolute inset-y-0 right-0 flex w-24"><button type="button" onClick={()=>setEditing(b)} style={{backgroundColor:'var(--action-edit)',color:'var(--action-edit-fg)'}} className="flex w-12 flex-col items-center justify-center gap-1"><i className="fa-solid fa-pen"></i><span className="text-[9px] font-bold">編輯</span></button><button type="button" onClick={()=>deleteBill(b)} style={{backgroundColor:'var(--action-delete)',color:'var(--action-delete-fg)'}} className="flex w-12 flex-col items-center justify-center gap-1"><i className="fa-solid fa-trash"></i><span className="text-[9px] font-bold">刪除</span></button></div><div style={{transform:openBillId===b.id?'translateX(-96px)':'translateX(0)'}} className="relative z-[1] bg-white rounded-card p-2.5 border border-earth-100 transition-transform duration-200">
                            <div className="flex items-start gap-2.5 min-w-0"><div className="w-9 h-9 bg-earth-50 rounded-btn flex items-center justify-center text-earth-500 shrink-0"><i className={`fa-solid ${b.category==='飲食'?'fa-utensils':b.category==='交通'?'fa-train-subway':b.category==='住宿'?'fa-bed':b.category==='購物'?'fa-bag-shopping':'fa-receipt'} text-xs`}></i></div><div className="flex-1 min-w-0"><h4 className="font-bold text-earth-800 text-sm break-words">{b.title}</h4><div className="text-[10px] text-earth-500 mt-0.5">{b.category || '其他'}{b.source ? ` · ${b.source}` : ''}</div></div><div className="shrink-0 text-right"><div className="flex items-center justify-end gap-1"><button type="button" onClick={()=>setOpenBillId(openBillId===b.id?null:b.id)} title="顯示卡片操作" aria-label="顯示編輯與刪除" className="flex h-5 w-5 items-center justify-center text-earth-500"><i className={`fa-solid ${openBillId===b.id?'fa-chevron-right':'fa-chevron-left'} text-[8px]`}></i></button><div className="font-black text-earth-800 text-sm">{ntAmount(shownAmount)}</div></div><div className="text-[9px] text-earth-400">{localAmount(shownAmount)}</div><div className="text-[9px] text-earth-500">{selectedPerson?`已付 ${ntAmount(personalPaid)} · 分攤 ${ntAmount(personalShare)}`:`${sharePeople.length} 人分攤`}</div></div></div>
                            {!selectedPerson&&<div className="mt-2 border-t border-earth-100 pt-2 space-y-1.5"><div className="flex flex-wrap items-center gap-1"><span className="text-[10px] text-earth-500 mr-1">付款人</span>{companions.map(person => <button type="button" key={`payer-${b.id}-${person}`} onClick={()=>setBillPayer(b.id, person)} className={`min-h-8 px-2 rounded border text-[10px] ${billPayers(b).some(p => p.person === person) ? 'bg-accent text-white border-accent' : 'bg-white text-earth-500 border-earth-200'}`}>{person}</button>)}</div><div className="flex flex-wrap items-center gap-1"><span className="text-[10px] text-earth-500 mr-1">分攤對象</span>{companions.map(person => <button type="button" key={`split-${b.id}-${person}`} onClick={()=>toggleBillPerson(b.id, person)} className={`min-h-8 px-2 rounded border text-[10px] ${(b.splitWith || []).includes(person) ? 'bg-earth-700 text-white border-earth-700' : 'bg-white text-earth-500 border-earth-200'}`}>{person}</button>)}</div></div>}
                        </div></div>;
                    })}
                    {editing && (
                        <div className="fixed inset-0 z-50 flex items-end justify-center bg-earth-900/60 backdrop-blur-sm animate-fadeIn">
                            <div className="modal-container w-full max-w-[480px]">
                                <div className="flex justify-between items-center p-3.5 border-b border-earth-100 bg-earth-50 shrink-0">
                                    <button onClick={()=>setEditing(null)} className="px-3 py-1.5 text-earth-600 text-[11px] font-bold bg-earth-200/50 rounded-btn">取消</button><h3 className="font-serif font-bold text-sm text-earth-800">{editing.id ? '編輯花費' : '新增花費'}</h3><button onClick={()=>{ editing.id ? updateData(bills.map(x=>x.id===editing.id?editing:x)) : updateData([...bills, {...editing, id: Date.now()}]); setEditing(null); }} className="px-4 py-1.5 bg-earth-800 text-white text-[11px] font-bold rounded-btn">儲存</button>
                                </div>
                                <div className="modal-content space-y-3">
                                    <div><label className="text-[10px] font-bold text-earth-500 mb-1 block">分類</label>
                                        <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-hide">
                                            {['飲食', '交通', '住宿', '購物', '其他'].map(cat => (<button type="button" key={cat} onClick={()=>setEditing({...editing, category: cat})} className={`px-2.5 py-1 rounded-btn text-xs font-bold border transition ${editing.category === cat ? 'bg-earth-800 text-white border-earth-800' : 'bg-white border-earth-200 text-earth-600'}`}>{cat}</button>))}
                                        </div>
                                    </div>
                                    <div><label className="text-[10px] font-bold text-earth-500 mb-1 block">名稱</label><input type="text" value={editing.title} onChange={e=>setEditing({...editing, title: e.target.value})} className="w-full border p-2 rounded-btn text-xs"/></div>
                                    <div><label className="text-[10px] font-bold text-earth-500 mb-1 block">金額 ({symbol})</label><input type="number" value={editing.amount} onChange={e=>setEditing({...editing, amount: e.target.value, amountEdited: true, payers: editingPayerPeople.map(p => ({ person: p, amount: Number(e.target.value || 0) / Math.max(1, editingPayerPeople.length) }))})} className="w-full border p-2 rounded-btn text-xs"/></div>
                                    <div><label className="text-[10px] font-bold text-earth-500 mb-1 block">付款人（可多選共同付款）</label><div className="flex flex-wrap gap-1.5">{companions.map(c => (<button type="button" key={c} onClick={()=>toggleEditingPayer(c)} className={`px-2.5 py-1 rounded text-xs font-bold border ${editingPayerPeople.includes(c) ? 'bg-accent text-white' : 'bg-earth-50 text-earth-600'}`}>{c}</button>))}</div></div>
                                    <div><label className="text-[10px] font-bold text-earth-500 mb-1 block">分攤對象</label><div className="flex flex-wrap gap-1.5">{companions.map(c => { const sel = editing.splitWith?.includes(c); return (<button type="button" key={c} onClick={()=>{const n = sel ? editing.splitWith.filter(x=>x!==c) : [...editing.splitWith, c]; setEditing({...editing, splitWith: n});}} className={`px-2.5 py-1 rounded text-xs font-bold border ${sel ? 'bg-accent text-white' : 'bg-earth-50 text-earth-600'}`}>{c}</button>) })}</div></div>
                                </div>
                            </div>
                        </div>
                    )}
                    {showCompanionManager && <CompanionManagerModal companions={companions} bills={bills} updateCompanions={updateCompanions} updateBills={updateData} onClose={() => setShowCompanionManager(false)} />}
                    {showSettlement && <div className="fixed inset-0 z-[60] flex items-end justify-center bg-earth-900/60 backdrop-blur-sm animate-fadeIn"><div className="modal-container w-full max-w-[480px]"><div className="flex justify-between items-center p-3.5 border-b border-earth-100 bg-earth-50 shrink-0"><button onClick={() => setShowSettlement(false)} className="px-3 py-1.5 text-earth-600 text-[11px] font-bold bg-earth-200/50 rounded-btn">關閉</button><h3 className="font-serif font-bold text-sm text-earth-800">分帳結算與轉帳</h3><button onClick={shareSummary} className="px-3 py-1.5 bg-earth-800 text-white text-[11px] font-bold rounded-btn">傳送帳單</button></div><div className="modal-content space-y-4"><div className="bg-earth-50 p-3 rounded-card border border-earth-100"><label className="text-[10px] font-bold text-earth-600 mb-1 block">收款／轉帳資訊</label><textarea rows="2" value={paymentInfo} onChange={e => updateMeta({ paymentInfo: e.target.value })} placeholder="例如：王小明／國泰世華 013／帳號 123-456-789" className="w-full bg-white border border-earth-200 rounded-btn p-2 text-xs"></textarea><p className="mt-1 text-[9px] text-earth-400">這段資訊會附在分享的結算單與個別轉帳訊息中。</p></div>{settlements.length ? <div className="space-y-2">{settlements.map((s, index) => <div key={`${s.from}-${s.to}-${index}`} className="bg-white border border-earth-100 rounded-card p-3 flex items-center justify-between gap-2"><div><div className="text-xs font-bold text-earth-800">{s.from} <i className="fa-solid fa-arrow-right text-earth-400 mx-1"></i> {s.to}</div><div className="mt-1 text-[11px] font-black text-accent-dark">{formatCurrency(s.amount, true)}</div></div><button type="button" onClick={() => sendSettlement(s)} className="shrink-0 px-3 py-2 rounded-btn bg-accent text-white text-[10px] font-bold"><i className="fa-brands fa-line mr-1"></i>傳送轉帳</button></div>)}</div> : <div className="py-8 text-center text-[11px] text-green-600 font-bold"><i className="fa-solid fa-circle-check text-lg block mb-2"></i>所有款項已平衡</div>}</div></div></div>}
                </div>

            const [newName, setNewName] = useState('');
            const [editingName, setEditingName] = useState(null);

            const handleAdd = () => {
                const trimmed = newName.trim();
                if(trimmed && !companions.includes(trimmed)) { updateCompanions([...companions, trimmed]); setNewName(''); }

            const handleDelete = (name) => {
                if(name === '我') return;
                updateCompanions(companions.filter(c => c !== name));
                const newBills = bills.map(b => { const payers = Array.isArray(b.payers) ? b.payers.filter(p => p.person !== name) : (b.payer === name ? [] : [{ person: b.payer || '我', amount: Number(b.amount || 0) }]); const next = payers.length ? payers : [{ person: '我', amount: Number(b.amount || 0) }]; return { ...b, payer: next[0].person, payers: next }; });
                updateBills(newBills);

                                    {formData.isRoundTrip && <div className="rounded-card border border-accent/30 bg-accent/5 p-3 space-y-2"><label className="flex items-center gap-2 text-[11px] font-bold text-earth-700"><input type="checkbox" checked={!!formData.includeTransfer} onChange={e=>{ const checked=e.target.checked; const nextTime=addOneHour(formData.date, formData.time); setFormData({...formData, includeTransfer:checked, transferDate:checked?(formData.transferDate || nextTime.date):formData.transferDate, transferTime:checked?(formData.transferTime || nextTime.time):formData.transferTime, transferFrom:checked?(formData.transferFrom || formData.to):formData.transferFrom}); }} className="accent-accent"/> 同一視窗新增轉機段</label>{formData.includeTransfer && <div className="grid grid-cols-2 gap-2"><div><label className="text-[9px] font-bold text-earth-500">轉機日期</label><input type="date" value={formData.transferDate || ''} onChange={e=>setFormData({...formData, transferDate:e.target.value})} className="w-full bg-white border rounded-btn p-1.5 text-xs"/></div><div><label className="text-[9px] font-bold text-earth-500">轉機時間</label><input type="time" value={formData.transferTime || ''} onChange={e=>setFormData({...formData, transferTime:e.target.value})} className="w-full bg-white border rounded-btn p-1.5 text-xs"/></div><div><label className="text-[9px] font-bold text-earth-500">轉機出發機場</label><AirportPicker value={formData.transferFrom || formData.to} onChange={v=>setFormData({...formData, transferFrom:v})} /></div><div><label className="text-[9px] font-bold text-earth-500">轉機抵達機場</label><AirportPicker value={formData.transferTo || ''} onChange={v=>setFormData({...formData, transferTo:v})} /></div><div><input value={formData.transferAirline || ''} onChange={e=>setFormData({...formData, transferAirline:e.target.value})} placeholder="轉機航空公司" className="w-full bg-white border rounded-btn p-1.5 text-xs"/></div><div><input value={formData.transferFlightNo || ''} onChange={e=                                         <div><label className="text-[10px] font-bold text-earth-500 mb-1 block">航空公司 (留空同去程)</label><input type="text" placeholder={formData.airline} value={formData.returnAirline} onChange={e=>setFormData({...formData, returnAirline:e.target.value})} className="w-full bg-white border border-earth-200 rounded-btn py-1.5 px-3 text-xs shadow-sm"/></div>
                                        <div><label className="text-[10px] font-bold text-earth-500 mb-1 block">回程航班編號</label><input type="text" value={formData.returnFlightNo} onChange={e=>setFormData({...formData, returnFlightNo:e.target.value})} className="w-full bg-white border border-earth-200 rounded-btn py-1.5 px-3 text-xs shadow-sm"/></div>
                                        <div className="col-span-2 grid grid-cols-3 gap-2"><label className="text-[10px] font-bold text-earth-500">航廈<input type="text" value={formData.returnTerminal||''} onChange={e=>setFormData({...formData, returnTerminal:e.target.value})} className="mt-1 w-full min-w-0 bg-white border border-earth-200 rounded-btn py-1.5 px-2 text-xs shadow-sm"/></label><label className="text-[10px] font-bold text-earth-500">登機門<input type="text" value={formData.returnGate||''} onChange={e=>setFormData({...formData, returnGate:e.target.value})} className="mt-1 w-full min-w-0 bg-white border border-earth-200 rounded-btn py-1.5 px-2 text-xs shadow-sm"/></label><label className="text-[10px] font-bold text-earth-500">座位<input type="text" value={formData.returnSeat||''} onChange={e=>setFormData({...formData, returnSeat:e.target.value})} className="mt-1 w-full min-w-0 bg-white border border-earth-200 rounded-btn py-1.5 px-2 text-xs shadow-sm"/></label></div>
                                    </div>
                                </div>

                        {pendingDateSave && <div className="absolute inset-0 z-10 flex items-end bg-earth-900/45 p-3"><div className="w-full rounded-card bg-white p-4 shadow-float"><h4 className="text-sm font-bold text-earth-800">班機日期已變更</h4><p className="mt-1 text-[11px] leading-relaxed text-earth-500">是否要讓原有行程跟著班機日期一起順移？「返回編輯」不會儲存任何變更。</p><div className="mt-3 grid grid-cols-1 gap-2"><button type="button" onClick={()=>setPendingDateSave(null)} className="min-h-10 rounded-btn bg-earth-100 text-xs font-bold text-earth-600">返回編輯</button><button type="button" onClick={()=>onSave({...pendingDateSave,shiftJourneySpots:false})} className="min-h-10 rounded-btn border border-earth-300 text-xs font-bold text-earth-700">只更新班機日期</button><button type="button" onClick={()=>onSave({...pendingDateSave,shiftJourneySpots:true})} className="min-h-10 rounded-btn bg-earth-800 text-xs font-bold text-white">班機與行程一起順移</button></div></div></div>}
                    </div>

            const list = activeData.shoppingList;
            const symbol = activeData.info.currencySymbol;

            const [editingItem, setEditingItem] = useState(null);
            const [zoomImg, setZoomImg] = useState(null);
            const [couponPreview, setCouponPreview] = useState(null);
            const [transferTarget,setTransferTarget]=useState(null);
            const [showCategoryManager, setShowCategoryManager] = useState(false);
            const [categoryDraft, setCategoryDraft] = useState('');
            const defaultCategories = ['電器', '美妝', '彩妝美容', '美髮', '食物'];
            const categories = activeData.shoppingCategories || defaultCategories;
            
            const allCategories = ['全部', ...categories];
            const usedStores = ['全部店家', ...new Set(list.flatMap(item => item.stores.map(s => s.name)))].filter(Boolean);
            const [catFilter, setCatFilter] = useState('全部');
            const [storeFilter, setStoreFilter] = useState('全部店家');
            const estimatedTotal = list.reduce((sum, item) => sum + (Number(item.estimatedPrice || item.price || 0) * Math.max(1, Number(item.quantity) || 1)), 0);
            const discounted = (store) => Number(store?.price || 0) * (1 - Number(store?.discountPercent || 0) / 100);
            const itemCost = (item) => {
                if (storeFilter !== '全部店家') {
                    const store = (item.stores || []).find(s => s.name === storeFilter);
                    if (store && Number(store.price)) return discounted(store);
                }
                return Number(item.estimatedPrice || item.price || 0);
            };
            const selectedTotal = list.filter(item => item.selectedForPurchase).reduce((sum, item) => sum + itemCost(item) * Math.max(1, Number(item.quantity) || 1), 0);
            const selectedOriginalTotal = list.filter(item => item.selectedForPurchase).reduce((sum, item) => { const store = storeFilter !== '全部店家' ? (item.stores || []).find(s => s.name === storeFilter) : null; return sum + (store ? Number(store.price || 0) : Number(item.estimatedPrice || item.price || 0)) * Math.max(1, Number(item.quantity) || 1); }, 0);
            const selectedDiscount = Math.max(0, selectedOriginalTotal - selectedTotal);

            const handleDelete = (id) => updateData(list.filter(i => i.id !== id));
            const displayList = list.filter(item => (catFilter === '全部' || item.category === catFilter) && (storeFilter === '全部店家' || item.stores.some(s => s.name === storeFilter))).map(item => storeFilter === '全部店家' ? item : { ...item, stores: item.stores.filter(s => s.name === storeFilter) });

            return (
                <div className="space-y-3 animate-fadeIn pb-6">
                    <div className="space-y-1.5">
                        <div className="flex items-center gap-1.5"><div className="flex-1 flex gap-1.5 overflow-x-auto scrollbar-hide pb-0.5">{allCategories.map(cat => (<button key={cat} onClick={() => setCatFilter(cat)} className={`whitespace-nowrap px-2.5 py-1 rounded-btn text-[10px] font-bold border transition ${catFilter === cat ? 'bg-earth-800 text-white border-earth-800' : 'bg-white border-earth-200 text-earth-600'}`}>{cat}</button>))}</div><button type="button" onClick={() => setShowCategoryManager(true)} className="shrink-0 w-7 h-7 rounded-btn bg-earth-50 text-earth-600 border border-earth-200" aria-label="管理購物分類"><i className="fa-solid fa-sliders text-[10px]"></i></button></div>

                    <div className="flex items-center justify-between bg-white rounded-card border border-earth-100 px-3 py-2 text-[10px] font-bold text-earth-700"><span><i className="fa-solid fa-calculator text-accent mr-1"></i>預計採買總額</span><div className="text-right"><div className="text-earth-900">全部 {formatCurrency(estimatedTotal, true)}</div><div className="text-accent">指定採買 {formatCurrency(selectedTotal, true)}</div>{selectedDiscount > 0 && <div className="text-green-600">已折扣 {formatCurrency(selectedDiscount, true)}</div>}</div></div>
                    <button onClick={() => setEditingItem({ category: '電器', name: '', photo: '', photoUrl: '', detail: '', quantity: 1, note: '', estimatedPrice: '', purchased: false, selectedForPurchase: false, linkedCouponId:'', customFields: [], stores: [] })} className="w-full py-2.5 border-2 border-dashed border-accent/50 rounded-card text-accent text-xs font-bold flex items-center justify-center gap-1.5 bg-white hover:bg-accent hover:text-white transition shadow-sm"><i className="fa-solid fa-plus"></i> 新增購物項目</button>
                    <div className="grid grid-cols-2 gap-2">
                    {displayList.map(item => (
                        <div key={item.id} className={`bg-white rounded-card p-2.5 shadow-sm border border-earth-100 relative ${item.purchased ? 'grayscale opacity-60' : ''}`}>
                            <div className="pr-1"><div className="relative w-full h-28 bg-earth-50 border border-earth-100 rounded-btn flex items-center justify-center overflow-hidden shadow-inner-soft cursor-zoom-in" onClick={() => (item.photo || item.photoUrl) && setZoomImg(item.photo || item.photoUrl)}>{(item.photo || item.photoUrl) ? <img src={item.photo || item.photoUrl} className="w-full h-full object-cover"/> : <i className="fa-solid fa-bag-shopping text-earth-300 text-2xl"></i>}{item.linkedCouponId&&<button type="button" onClick={event=>{event.stopPropagation();setCouponPreview((activeData.coupons||[]).find(coupon=>String(coupon.id)===String(item.linkedCouponId))||null);}} className="absolute right-1.5 top-1.5 flex h-8 w-8 items-center justify-center rounded-full border border-white/70 bg-white/90 text-accent shadow-sm" aria-label="查看連結的優惠券"><i className="fa-solid fa-ticket"></i></button>}</div><div className="pt-1.5"><div className="flex items-center justify-between gap-1"><span className="text-[8px] bg-earth-100 text-earth-500 px-1 py-0.5 rounded font-bold">{item.category}</span><div className="flex gap-0.5"><button type="button" onClick={()=>setTransferTarget({item,move:false})} title="複製至本次或其他旅程購物清單" aria-label="複製購物小卡" className="flex w-7 h-7 items-center justify-center rounded-btn text-earth-500 hover:bg-earth-100"><i className="fa-regular fa-copy text-[10px]"></i></button><button type="button" onClick={()=>setTransferTarget({item,move:true})} title="移動至其他旅程購物清單" aria-label="移動購物小卡" className="flex w-7 h-7 items-center justify-center rounded-btn text-earth-500 hover:bg-earth-100"><i className="fa-solid fa-arrow-right-arrow-left text-[10px]"></i></button><button type="button" onClick={()=>setEditingItem(list.find(i=>i.id===item.id))} title="編輯購物小卡" aria-label="編輯購物小卡" className="flex w-7 h-7 items-center justify-center rounded-btn text-earth-500 hover:bg-earth-100"><i className="fa-solid fa-pen text-[10px]"></i></button><button type="button" onClick={()=>handleDelete(item.id)} title="刪除購物小卡" aria-label="刪除購物小卡" className="flex w-7 h-7 items-center justify-center rounded-btn text-red-400 hover:bg-red-50"><i className="fa-solid fa-trash text-[10px]"></i></button></div></div><h4 className="font-bold text-earth-800 text-[11px] mt-0.5 leading-tight break-words">{item.name}</h4><div className="text-[8px] text-earth-500 mt-0.5 truncate">{item.detail || ''}{item.quantity ? `｜數量 ${item.quantity}` : ''}</div></div></div>
                            <div className="mt-1 text-[9px] font-bold"><div className="text-earth-500 truncate">{item.note || ''}</div><div className="mt-1 flex items-center justify-between gap-1"><label className="flex items-center gap-1 text-earth-700 whitespace-nowrap"><input type="checkbox" checked={!!item.purchased} onChange={e => updateData(list.map(x => x.id === item.id ? {...x, purchased: e.target.checked} : x))} className="accent-accent"/> 已購買</label><label className="flex items-center gap-1 text-accent whitespace-nowrap"><input type="checkbox" checked={!!item.selectedForPurchase} onChange={e => updateData(list.map(x => x.id === item.id ? {...x, selectedForPurchase: e.target.checked} : x))} className="accent-accent"/> 指定採買</label></div></div>
                            {item.customFields?.length > 0 && <div className="mt-1 text-[9px] text-earth-500">{item.customFields.map(f => `${f.label}：${f.value}`).join('／')}</div>}
                            <details className="mt-1.5 border-t border-earth-100 pt-1.5"><summary className="cursor-pointer text-[9px] font-bold text-earth-500">店家比價 {(item.stores||[]).length} 筆</summary><div className="mt-1 space-y-1 max-h-28 overflow-y-auto">
                                {item.stores.length > 0 ? item.stores.map((s, i) => {

                                            <div className="text-right">
                                                <div className="font-black text-earth-800 text-xs">{formatCurrency(discounted, true)}</div>
                                                <div className="text-[8px] text-earth-400 font-bold">{s.discountPercent > 0 ? <span className="line-through opacity-50 mr-1">{formatCurrency(s.price, false)}</span> : null}{formatCurrency(discounted, false)}</div>
                                            </div>
                                        </div>
                                    )
                                }) : <div className="text-[9px] text-earth-400">尚未加入商店比價</div>}
                            </div></details>
                        </div>
                    ))}
                    </div>

                const locationHint=[searchCity,searchCountry||activeData.info.country].filter(Boolean).join(' ');const searches=[...new Set(raw.flatMap(value=>[`${value} ${locationHint}`.trim(),`${value} ${searchCountry||activeData.info.country||''}`.trim(),value]))].slice(0,8);let found=[];for(const keyword of searches){try{const results=await searchPlace(keyword,undefined,true);found.push(...results);if(found.length>=5)break;}catch{}}const unique=found.filter((place,index,array)=>array.findIndex(other=>`${other.name}|${other.detail}`===`${place.name}|${place.detail}`)===index).slice(0,5);setCandidates(unique);setMessage(unique.length?'已從圖片文字、國家城市與來源找到可能地點，確認前不會加入行程。':'無法確定地點，請修改辨識文字、國家城市或搜尋線索後重試。');
            }finally{setLoading(false);}};
            const hydrate=async place=>{try{return await resolveSuggestedPlace(place);}catch{return place;}};
            const toSpot=(place,extra={})=>({id:Date.now()+Math.floor(Math.random()*10000),title:place.name||query||'待確認地點',subtitle:place.localName||'',address:place.detail||'',lat:Number(place.lat),lng:Number(place.lng),photo:image,sourceUrl,sourceTitle:pageTitle,imageSource:fileName,imageText,type:extra.type||inferredType(place),time:'',remark:extra.remark||'由旅遊靈感匣加入'});
            const addBackup=async place=>{const resolved=await hydrate(place),spot=toSpot(resolved);updateData({backupSpots:[...(activeData.backupSpots||[]),spot]});setMessage(`已將「${spot.title}」加入備用行程。`);};
            const beginAdd=place=>{setAdding(place);setTargetType(inferredType(place));setTargetDate(dates[0]?.date||activeData.info.startDate||'');};
            const confirmAdd=async()=>{const resolved=await hydrate(adding),spot={...toSpot(resolved,{type:targetType}),date:targetDate};updateData({spots:[...(activeData.spots||[]),spot]});setAdding(null);setMessage(`已將「${spot.title}」加入 ${targetDate} 行程。`);};
            const saveLater=()=>{const item={id:Date.now(),image,fileName,sourceUrl,pageTitle,imageText,query,searchCountry,searchCity,candidates,createdAt:new Date().toISOString()};updateData({inspirationItems:[...saved,item]});setMessage('已儲存到稍後整理。');};
            const mapPlace=async place=>{const resolved=await hydrate(place);window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(Number.isFinite(resolved.lat)&&Number.isFinite(resolved.lng)?`${resolved.lat},${resolved.lng}`:resolved.name||resolved.detail)}`,'_blank');};
            const reset=()=>{setImage('');setFileName('');setCandidates([]);setQuery('');setImageText('');setSourceUrl('');setPageTitle('');setMessage('');};
            return <div className="space-y-3 pb-6 animate-fadeIn">
                <section onDragOver={event=>event.preventDefault()} onDrop={event=>{event.preventDefault();readImage(event.dataTransfer.files?.[0]);}} className="rounded-card border-2 border-dashed border-accent/40 bg-white p-3 shadow-sm">
                    {image?<div className="relative"><img src={image} className="h-48 w-full rounded-card object-contain bg-earth-50"/><button onClick={reset} className="absolute right-2 top-2 h-8 w-8 rounded-full bg-earth-900/70 text-white">×</button></div>:<label className="flex min-h-36 cursor-pointer flex-col items-center justify-center text-center"><i className="fa-solid fa-images text-3xl text-accent"></i><b className="mt-2 text-sm text-earth-700">上傳、選擇、貼上或拖放圖片</b><span className="mt-1 text-[10px] text-earth-400">桌面版可直接拖放；也可從剪貼簿貼上圖片</span><input type="file" accept="image/*" onChange={event=>readImage(event.target.files?.[0])} className="hidden"/></label>}

                <button onClick={()=>{setCandidates([{name:query||'手動建立地點',detail:imageText||pageTitle||'',lat:NaN,lng:NaN}]);setMessage('請確認手動建立的地點名稱，之後仍可在行程中補上地圖位置。');}} className="w-full min-h-10 rounded-btn border border-earth-200 bg-white text-xs font-bold text-earth-600">手動建立地點</button>
                {!!saved.length&&<section className="space-y-2"><h3 className="px-1 text-xs font-bold text-earth-700">稍後整理</h3>{saved.map(item=><article key={item.id} className="flex items-center gap-2 rounded-card border bg-white p-2"><img src={item.image} className="h-14 w-14 rounded-btn object-cover"/><div className="min-w-0 flex-1"><div className="truncate text-xs font-bold">{item.query||item.imageText||item.pageTitle||item.fileName||'待整理圖片'}</div><div className="text-[9px] text-earth-400">{[item.searchCountry,item.searchCity].filter(Boolean).join('／')||new Date(item.createdAt).toLocaleDateString('zh-TW')}</div></div><button onClick={()=>{setImage(item.image);setFileName(item.fileName||'');setSourceUrl(item.sourceUrl||'');setPageTitle(item.pageTitle||'');setImageText(item.imageText||'');setQuery(item.query||'');setSearchCountry(item.searchCountry||activeData.info.country||'');setSearchCity(item.searchCity||'');setCandidates(item.candidates||[]);window.scrollTo({top:0,behavior:'smooth'});}} className="h-9 w-9 text-accent"><i className="fa-solid fa-arrow-up"></i></button><button onClick={()=>updateData({inspirationItems:saved.filter(entry=>entry.id!==item.id)})} className="h-9 w-9 text-red-400"><i className="fa-solid fa-trash"></i></button></article>)}</section>}
                {adding&&<div className="fixed inset-0 z-[150] flex items-end justify-center bg-earth-900/60"><div className="modal-container w-full max-w-[480px]"><div className="flex items-center justify-between border-b bg-earth-50 p-3"><button onClick={()=>setAdding(null)} className="rounded-btn bg-earth-100 px-3 py-1.5 text-xs font-bold">取消</button><h3 className="text-sm font-bold">加入正式行程</h3><button onClick={confirmAdd} disabled={!targetDate} className="rounded-btn bg-earth-800 px-3 py-1.5 text-xs font-bold text-white">建立</button></div><div className="modal-content grid grid-cols-2 gap-2"><div className="col-span-2 flex items-center gap-2 rounded-card bg-earth-50 p-2">{image&&<img src={image} className="h-14 w-14 rounded object-cover"/>}<div><b className="text-xs">{adding.name}</b><div className="text-[10px] text-earth-400">{adding.detail}</div></div></div><label className="text-[10px] font-bold text-earth-500">日期<select value={targetDate} onChange={e=>setTargetDate(e.target.value)} className="mt-1 w-full rounded-btn border p-2 text-xs">{dates.map(date=><option key={date.date} value={date.date}>{date.day}｜{date.label}</option>)}</select></label><label className="text-[10px] font-bold text-earth-500">分類<select value={targetType} onChange={e=>setTargetType(e.target.value)} className="mt-1 w-full rounded-btn border p-2 text-xs"><option value="attraction">景點</option><option value="food">美食</option><option value="accommodation">住宿</option><option value="shopping">購物</option><option value="meeting">會面點</option><option value="activity">活動</option></select></label></div></div></div>}

        };

        const BackupView = ({ activeData, updateData, dates }) => {

            const [placeRetry,setPlaceRetry]=useState(0);
            const backupSpots = activeData.backupSpots || [];
            const saveBackup=()=>{if(!editingSpot.title?.trim())return;const next=editingSpot.id?backupSpots.map(spot=>spot.id===editingSpot.id?editingSpot:spot):[...backupSpots,{...editingSpot,id:Date.now()}];updateData({backupSpots:next});setEditingSpot(null);};
            return (

                    <button onClick={()=>setEditingSpot({title:'',subtitle:'',address:'',type:'attraction',remark:'',photo:''})} className="w-full min-h-11 rounded-card border-2 border-dashed border-accent/50 bg-white text-xs font-bold text-accent"><i className="fa-solid fa-plus mr-1"></i>新增備用行程</button>
                    <p className="text-[10px] text-earth-600 bg-white p-3 rounded-card border border-earth-100 shadow-sm font-semibold leading-relaxed">尚未決定日期的地點。點選卡片右側可排入指定日期。</p>
                    {backupSpots.length === 0 ? <div className="text-center py-12 text-earth-400 bg-white rounded-card border border-earth-100 shadow-sm"><i className="fa-regular fa-folder-open text-3xl mb-1 opacity-30"></i><p className="text-xs font-bold">目前無備用行程</p></div> : (
                        <div className="space-y-2.5">

                                    <button onClick={() => setEditingSpot(spot)} className="w-8 h-8 rounded-btn bg-earth-50 text-earth-500 flex shrink-0 items-center justify-center"><i className="fa-solid fa-pen"></i></button><button onClick={() => setTargetSpot(spot)} className="w-8 h-8 rounded-btn bg-earth-50 text-accent border border-earth-200 shadow-sm hover:bg-accent hover:text-white transition flex shrink-0 items-center justify-center"><i className="fa-solid fa-calendar-plus"></i></button><button onClick={()=>updateData({backupSpots:backupSpots.filter(item=>item.id!==spot.id)})} className="w-8 h-8 rounded-btn bg-red-50 text-red-400 flex shrink-0 items-center justify-center"><i className="fa-solid fa-trash"></i></button>
                                </div>
                            ))}
                        </div>
                    )}
                    {editingSpot&&<div className="fixed inset-0 z-[120] flex items-end justify-center bg-earth-900/60"><div className="modal-container w-full max-w-[480px]"><div className="flex items-center justify-between border-b bg-earth-50 p-3"><button onClick={()=>setEditingSpot(null)} className="rounded-btn bg-earth-100 px-3 py-1.5 text-xs font-bold">取消</button><h3 className="text-sm font-bold">{editingSpot.id?'修改備用行程':'新增備用行程'}</h3><button onClick={saveBackup} disabled={!editingSpot.title?.trim()} className="rounded-btn bg-earth-800 px-3 py-1.5 text-xs font-bold text-white disabled:opacity-30">儲存</button></div><div className="modal-content grid grid-cols-2 gap-2"><div className="col-span-2"><label className="text-[10px] font-bold text-earth-500">地點名稱</label><div className="mt-1"><PlaceAutocompleteInput value={editingSpot.title||''} knownPlaces={[...(activeData.spots||[]),...backupSpots]} onChange={value=>{setEditingSpot({...editingSpot,title:value});setShowPlaceFallback(false);}} onPick={place=>{setEditingSpot({...editingSpot,title:place.name,address:place.detail||editingSpot.address,lat:place.lat,lng:place.lng});setShowPlaceFallback(false);}} onNotFound={()=>setShowPlaceFallback(true)} retryKey={placeRetry}/></div></div><label className="text-[10px] font-bold text-earth-500">外語／副標題<input value={editingSpot.subtitle||''} onChange={e=>setEditingSpot({...editingSpot,subtitle:e.target.value})} className="mt-1 w-full rounded-btn border p-2 text-xs"/></label><label className="text-[10px] font-bold text-earth-500">分類<select value={editingSpot.type||'attraction'} onChange={e=>setEditingSpot({...editingSpot,type:e.target.value})} className="mt-1 w-full rounded-btn border p-2 text-xs"><option value="attraction">景點</option><option value="food">美食</option><option value="accommodation">住宿</option><option value="shopping">購物</option><option value="meeting">會面點</option><option value="activity">活動</option></select></label><button type="button" onClick={()=>setShowPlaceFallback(value=>!value)} className="col-span-2 min-h-9 text-left text-[10px] font-bold text-accent">搜尋不到？使用完整地址、Google Maps 連結或其他地圖 <i className={`fa-solid ${showPlaceFallback?'fa-chevron-up':'fa-chevron-down'} ml-1`}></i></button>{showPlaceFallback&&<div className="col-span-2"><PlaceFallback title={editingSpot.title} address={editingSpot.address} lat={editingSpot.lat} lng={editingSpot.lng} country={activeData.info.country||''} onPick={place=>{setEditingSpot({...editingSpot,title:place.name||editingSpot.title,address:place.detail||editingSpot.address,lat:place.lat,lng:place.lng});setShowPlaceFallback(false);}} onAddress={address=>setEditingSpot({...editingSpot,address})} onStoreLink={link=>setEditingSpot({...editingSpot,mapLink:link})} onRetry={()=>setPlaceRetry(value=>value+1)}/></div>}<label className="col-span-2 text-[10px] font-bold text-earth-500">地址<input value={editingSpot.address||''} onChange={e=>setEditingSpot({...editingSpot,address:e.target.value})} className="mt-1 w-full rounded-btn border p-2 text-xs"/></label>{Number.isFinite(Number(editingSpot.lat))&&Number.isFinite(Number(editingSpot.lng))&&<div className="col-span-2 flex items-center justify-between rounded-btn bg-green-50 px-2.5 py-2 text-[10px] font-bold text-green-700"><span><i className="fa-solid fa-location-dot mr-1"></i>已確認地圖位置</span><a href={`https://www.google.com/maps/search/?api=1&query=${editingSpot.lat},${editingSpot.lng}`} target="_blank" rel="noopener noreferrer" className="underline">查看地圖</a></div>}<label className="col-span-2 text-[10px] font-bold text-earth-500">備註<textarea value={editingSpot.remark||''} onChange={e=>setEditingSpot({...editingSpot,remark:e.target.value})} className="mt-1 w-full rounded-btn border p-2 text-xs" rows="2"/></label></div></div></div>}
                    {targetSpot && (

                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const TipsView = ({ activeData, updateData, onTransfer }) => {
            const [editing, setEditing] = useState(null);
            const tips = activeData.tips || [];
            const [newChecklistItems, setNewChecklistItems] = useState({});
            const categoryMeta = { '緊急': ['fa-triangle-exclamation', 'bg-red-50 text-red-600 border-red-100'], '醫療': ['fa-kit-medical', 'bg-rose-50 text-rose-600 border-rose-100'], '警察': ['fa-shield-halved', 'bg-indigo-50 text-indigo-600 border-indigo-100'], '緊急聯絡方式': ['fa-phone-volume', 'bg-orange-50 text-orange-600 border-orange-100'], '緊急聯絡人': ['fa-user-shield', 'bg-violet-50 text-violet-600 border-violet-100'], '避難所': ['fa-house-tsunami', 'bg-cyan-50 text-cyan-600 border-cyan-100'], '保險': ['fa-shield-heart', 'bg-blue-50 text-blue-600 border-blue-100'], '天氣': ['fa-cloud-sun', 'bg-amber-50 text-amber-600 border-amber-100'], '提醒': ['fa-bell', 'bg-earth-50 text-earth-600 border-earth-200'], 'Checklist': ['fa-list-check', 'bg-accent/10 text-accent-dark border-accent/30'], '其他': ['fa-circle-info', 'bg-earth-50 text-earth-600 border-earth-200'] };
            const categoryOrder = ['緊急', '緊急聯絡方式', '緊急聯絡人', '醫療', '警察', '避難所', '保險', '天氣', '提醒', 'Checklist', '其他'];
            const checklistItems = (tip) => Array.isArray(tip.items) ? tip.items : String(tip.content || '').split(/\n|、|，/).map(x => ({ text: x.trim(), done: false })).filter(x => x.text);
            const sortedTips = [...tips].sort((a, b) => categoryOrder.indexOf(a.category) - categoryOrder.indexOf(b.category));
            return (
                <div className="space-y-3 animate-fadeIn pb-6">
                    <button onClick={() => setEditing({ category: '提醒', title: '', content: '' })} className="w-full py-2.5 border-2 border-dashed border-accent/50 rounded-card text-accent text-xs font-bold flex items-center justify-center gap-1.5 bg-white shadow-sm hover:bg-accent hover:text-white transition"><i className="fa-solid fa-plus"></i> 新增旅遊須知</button>
                    {!sortedTips.length && <div className="bg-white border border-dashed border-earth-300 rounded-card p-8 text-center text-[11px] text-earth-400">尚未加入旅遊須知</div>}
                    {sortedTips.map((t, index) => {
                        const [icon, color] = categoryMeta[t.category] || categoryMeta['提醒'];
                        const showHeading = index === 0 || sortedTips[index - 1].category !== t.category;
                        return <React.Fragment key={t.id}>

                            <div className={`bg-white rounded-card p-3.5 shadow-sm border relative ${t.category === '緊急' ? 'border-red-200' : 'border-earth-100'}`}>
                                <details className="absolute top-2 right-2 z-10"><summary className="list-none w-8 h-8 rounded-btn bg-earth-50 text-earth-500 flex items-center justify-center cursor-pointer"><i className="fa-solid fa-ellipsis-vertical"></i></summary><div className="absolute right-0 top-8 w-28 bg-white rounded-card shadow-float border border-earth-100 overflow-hidden"><button onClick={()=>onTransfer(t,false)} className="w-full text-left px-3 py-2 text-[10px]">複製到其他旅程</button><button onClick={()=>onTransfer(t,true)} className="w-full text-left px-3 py-2 text-[10px]">移動到其他旅程</button><button onClick={()=>setEditing(t)} className="w-full text-left px-3 py-2 text-[10px]">編輯</button><button onClick={()=>updateData(tips.filter(x=>x.id!==t.id))} className="w-full text-left px-3 py-2 text-[10px] text-red-500">刪除</button></div></details>
                                {(t.category === 'Checklist' || t.isChecklist || t.title === '必帶物品') ? <details open><summary className="pr-10 flex items-center gap-2 cursor-pointer list-none"><div className={`w-8 h-8 rounded-btn border flex items-center justify-center shrink-0 ${color}`}><i className={`fa-solid ${icon} text-xs`}></i></div><h4 className="font-bold text-earth-800 text-xs flex-1">{t.title} Checklist</h4><span className="text-[9px] text-earth-500">{checklistItems(t).filter(x=>x.done).length}/{checklistItems(t).length} 完成</span></summary><div className="space-y-1.5 mt-2">{checklistItems(t).map((item, idx) => <div key={`${t.id}-${idx}`} className="flex items-center gap-2 text-[11px] text-earth-700"><input type="checkbox" checked={!!item.done} onChange={e=>{const items=checklistItems(t).map(x=>({...x})); items[idx]={...items[idx],done:e.target.checked}; updateData(tips.map(x=>x.id===t.id?{...x,items}:x));}} className="accent-accent"/><span className={item.done ? 'line-through text-earth-400' : ''}>{item.text}</span><button type="button" onClick={()=>{const items=checklistItems(t).filter((_,i)=>i!==idx); updateData(tips.map(x=>x.id===t.id?{...x,items}:x));}} className="ml-auto text-red-300"><i className="fa-solid fa-xmark"></i></button></div>)}</div><div className="flex gap-1.5 mt-2"><input value={newChecklistItems[t.id] || ''} onChange={e=>setNewChecklistItems({...newChecklistItems,[t.id]:e.target.value})} placeholder="新增待辦物品" className="flex-1 border border-earth-200 rounded p-1.5 text-[10px]"/><button type="button" onClick={()=>{const draft=(newChecklistItems[t.id] || '').trim(); if(!draft)return; const items=checklistItems(t); updateData(tips.map(x=>x.id===t.id?{...x,items:[...items,{text:draft,done:false}]}:x)); setNewChecklistItems({...newChecklistItems,[t.id]:''});}} className="px-2 rounded bg-accent text-white text-[10px] font-bold">新增</button></div></details> : <div className="flex gap-2.5 pr-10"><div className={`w-8 h-8 rounded-btn border flex items-center justify-center shrink-0 ${color}`}><i className={`fa-solid ${icon} text-xs`}></i></div><div><h4 className="font-bold text-earth-800 text-xs mb-1">{t.title}</h4><p className="text-[11px] text-earth-600 whitespace-pre-line leading-relaxed">{t.content}</p></div></div>}
                            </div>
                        </React.Fragment>;
                    })}
                    {editing && (
                        <div className="fixed inset-0 z-50 flex items-end justify-center bg-earth-900/60 backdrop-blur-sm animate-fadeIn">
                            <div className="modal-container w-full max-w-[480px]">
                                <div className="flex justify-between items-center p-3.5 border-b border-earth-100 bg-earth-50 shrink-0"><button onClick={()=>setEditing(null)} className="px-3 py-1.5 text-earth-600 text-[11px] font-bold bg-earth-200/50 rounded-btn">取消</button><h3 className="font-bold text-sm text-earth-800">{editing.id ? '編輯須知' : '新增須知'}</h3><button onClick={()=>{ editing.id ? updateData(tips.map(x=>x.id===editing.id?editing:x)) : updateData([...tips, {...editing, id: Date.now()}]); setEditing(null); }} className="px-4 py-1.5 bg-earth-800 text-white text-[11px] font-bold rounded-btn">儲存</button></div>
                                <div className="modal-content space-y-3"><select value={editing.category} onChange={e=>setEditing({...editing, category: e.target.value, isChecklist: e.target.value === 'Checklist', title: e.target.value === 'Checklist' && !editing.title ? '必帶物品' : editing.title})} className="w-full border p-2 rounded-btn text-xs"><option>緊急</option><option>醫療</option><option>警察</option><option>緊急聯絡方式</option><option>緊急聯絡人</option><option>避難所</option><option>保險</option><option>天氣</option><option>提醒</option><option>Checklist</option><option>其他</option></select><label className="flex items-center gap-2 text-xs font-bold text-earth-700"><input type="checkbox" checked={!!editing.isChecklist || editing.category === 'Checklist' || editing.title === '必帶物品'} onChange={e=>setEditing({...editing, isChecklist:e.target.checked, category:e.target.checked ? 'Checklist' : editing.category, title:e.target.checked ? '必帶物品' : editing.title})} className="accent-accent"/> 使用 Checklist 清單</label><input type="text" placeholder="標題" value={editing.title} onChange={e=>setEditing({...editing, title: e.target.value})} className="w-full border p-2 rounded-btn text-xs"/><textarea placeholder="內容（Checklist 可用換行分隔項目）" rows="4" value={editing.content} onChange={e=>setEditing({...editing, content: e.target.value})} className="w-full border p-2 rounded-btn text-xs"></textarea></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./service-worker.js').catch(function (error) {
                    console.warn('Service Worker 註冊失敗', error);
                });
            });
        }
    </script>
</body>
</html>
