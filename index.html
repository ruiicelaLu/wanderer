    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const generateDates = (start, end) => {
            const dates = [];
            let curr = new Date(start);
            // Guard against a momentarily inverted range (e.g. a departure date edited past the
            // current return date before the return is updated too) so the day list never goes
            // fully empty — it just temporarily collapses to a single day.
            const endDate = new Date(end) < curr ? new Date(curr) : new Date(end);
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            let dayCount = 1;
            while (curr <= endDate) {
                const dateStr = curr.toISOString().split('T')[0];
                const mmdd = `${(curr.getMonth()+1).toString().padStart(2,'0')}/${curr.getDate().toString().padStart(2,'0')}`;
                dates.push({ date: dateStr, label: `${mmdd} (${days[curr.getDay()]})`, day: `Day ${dayCount}` });
                curr.setDate(curr.getDate() + 1); dayCount++;
            }
            return dates;

        const translateInterfaceDOM=(language,root=document)=>{

                reader.readAsDataURL(file);
            };
            const loadLimitedBackgroundImage = (file) => {

            const fetchExchangeRate = async () => {

                setIsFetchingRate(true); setRateMsg('');
                try {
                    const res = await fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/twd.json`);
                    const data = await res.json();
                    const code = formData.currencyCode.toLowerCase();
                    if (data.twd && data.twd[code]) {
                        const rate = 1 / data.twd[code];
                        setFormData({...formData, exchangeRate: parseFloat(rate.toFixed(4))});
                        setRateMsg('✅ 已更新');
                    } else setRateMsg('⚠️ 無法取得');
                } catch (e) { setRateMsg('⚠️ 錯誤'); }
                setIsFetchingRate(false); setTimeout(()=>setRateMsg(''), 3000);
            };

label}</label>)}</div></div>

                            </div>}
                            {formData.backgroundImage&&<div className="flex items-center gap-2 rounded-btn border border-earth-100 bg-earth-50 p-2"><img src={formData.backgroundImage} className="h-12 w-20 rounded object-cover"/><span className="flex-1 text-[10px] text-earth-500">已套用自訂背景</span><button type="button" onClick={()=>setFormData({...formData,backgroundImage:''})} className="min-h-8 px-2 text-[10px] font-bold text-red-400">移除</button></div>}

                                        <button type="button" onClick={() => setConfirmDelete(true)} className="w-full py-2.5 bg-red-50 text-red-500 rounded-btn text-xs font-bold hover:bg-red-100 transition shadow-sm"><i className="fa-solid fa-trash mr-1.5"></i>刪除此旅程</button>
                                    ) : (
                                        <div className="flex gap-2">
                                            <button type="button" onClick={() => setConfirmDelete(false)} className="flex-1 py-2.5 bg-earth-100 text-earth-600 rounded-btn text-xs font-bold hover:bg-earth-200 transition">取消</button>
                                            <button type="button" onClick={onDelete} className="flex-1 py-2.5 bg-red-500 text-white rounded-btn text-xs font-bold shadow-sm active:scale-95 transition"><i className="fa-solid fa-triangle-exclamation mr-1"></i>確認刪除</button>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const DailyRouteMap = ({ timelineItems, updateData, allSpots }) => {
            const mapRef = useRef(null);
            const mapInstance = useRef(null);
            const layers = useRef(null);
            const [manualTransport, setManualTransport] = useState({});
            useEffect(() => () => { if (mapInstance.current) { mapInstance.current.remove(); mapInstance.current = null; layers.current = null; } }, []);
            const distanceKm = (a, b) => {
                const rad = n => n * Math.PI / 180;
                const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
                const x = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
                return 6371 * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
            };
            const transport = { '大眾運輸': { icon: 'fa-train-subway', speed: 22, extra: 8 }, '自駕': { icon: 'fa-car', speed: 30, extra: 3 }, '計程車': { icon: 'fa-taxi', speed: 30, extra: 3 }, '包車': { icon: 'fa-van-shuttle', speed: 30, extra: 3 }, '步行': { icon: 'fa-person-walking', speed: 4.5, extra: 0 } };
            const estimate = (from, to, type) => {
                const km = distanceKm(from, to), setting = transport[type] || transport['大眾運輸'];
                return { km, mins: Math.max(1, Math.round(km / setting.speed * 60 + setting.extra)) };
            };
            const escapeMapText = (value) => String(value || '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[ch]);
            const mapDayFlights=(timelineItems||[]).filter(item=>item.kind==='flight').map(item=>item.data);
            const showFlightLegs=mapDayFlights.length>1||mapDayFlights.some(f=>['connection','transfer','layover'].includes(String(f.type||'').toLowerCase()));

            // Use the exact displayed card sequence, including both ends of each flight.
            // Never sort a second time here: a map must agree with the itinerary above it.
            const stops = useMemo(() => {
                return (timelineItems || []).flatMap(item => {
                    if (item.kind === 'spot') {
                        const s = item.data;
                        const hasCoords = s.lat != null && s.lng != null && s.lat !== '' && s.lng !== '' && Number.isFinite(Number(s.lat)) && Number.isFinite(Number(s.lng));
                        return [{ key: `spot-${s.id}`, kind: 'spot', title: s.title, time: s.time || '', lat: hasCoords ? Number(s.lat) : null, lng: hasCoords ? Number(s.lng) : null, ref: s }];
                    }
                    const f = item.data, from = getAirportCoords(f.from), to = getAirportCoords(f.to);
                    return [{ key: `flight-${f.id}-from`, kind: 'flight-from', title: `✈️ ${f.from}${f.departureTerminal ? ` ${f.departureTerminal}` : ''}`, time: f.time || '', lat: from?.lat ?? null, lng: from?.lng ?? null, flight: f }, { key: `flight-${f.id}-to`, kind: 'flight-to', title: `✈️ ${f.to}${f.arrivalTerminal ? ` ${f.arrivalTerminal}` : ''}`, time: f.time || '', lat: to?.lat ?? null, lng: to?.lng ?? null, flight: f }];
                });
            }, [timelineItems]);
            const mapStops = stops.filter(stop => Number.isFinite(stop.lat) && Number.isFinite(stop.lng));
            const missingCoordsFlights = (timelineItems || []).filter(item => item.kind === 'flight' && (!getAirportCoords(item.data.from) || !getAirportCoords(item.data.to))).map(item => item.data);

            const setTransport = (segmentKey, toStop, type) => {
                if (toStop.kind === 'spot') { updateData({ spots: allSpots.map(s => s.id === toStop.ref.id ? { ...s, transportType: type } : s) }); }
                else { setManualTransport(current => ({ ...current, [segmentKey]: type })); }
            };

            useEffect(() => {
                if (!mapStops.length) { if (mapInstance.current) { mapInstance.current.remove(); mapInstance.current = null; layers.current = null; } return; }
                if (!mapRef.current) return;
                if (!mapInstance.current) {
                    mapInstance.current = L.map(mapRef.current, { zoomControl: false, attributionControl: true });
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 20, attribution:'&copy; OpenStreetMap contributors &copy; CARTO' }).addTo(mapInstance.current);
                    layers.current = L.layerGroup().addTo(mapInstance.current);
                }
                const map = mapInstance.current, group = layers.current;
                group.clearLayers();
                let spotCounter = 0;
                const latlngs = mapStops.map((stop) => {
                    const point = [stop.lat, stop.lng];
                    const isFlight = stop.kind !== 'spot';
                    const html = isFlight
                        ? `<div style="background:var(--theme-secondary);color:var(--theme-on-primary,#fff);width:24px;height:24px;border-radius:50%;border:2px solid var(--theme-surface);display:grid;place-items:center;font-size:10px;box-shadow:0 2px 6px rgba(56,48,40,.18)"><i class="fa-solid fa-plane" style="font-size:9px"></i></div>`
                        : `<div style="background:var(--theme-primary);color:var(--theme-on-primary,#fff);width:24px;height:24px;border-radius:50%;border:2px solid var(--theme-surface);display:grid;place-items:center;font-size:10px;font-weight:700;box-shadow:0 2px 6px rgba(56,48,40,.18)">${++spotCounter}</div>`;
                    const icon = L.divIcon({ className: 'daily-route-pin', html, iconSize: [24, 24], iconAnchor: [12, 12] });
                    L.marker(point, { icon }).addTo(group).bindPopup(`<b>${escapeMapText(stop.title)}</b><br>${escapeMapText(stop.time)}`);
                    return point;
                });
                for (let i = 0; i < stops.length - 1; i++) {
                    if (stops[i].lat == null || stops[i + 1].lat == null) continue;
                    const isFlightLeg = stops[i].kind === 'flight-from' && stops[i + 1].kind === 'flight-to' && stops[i].flight.id === stops[i + 1].flight.id;
                    if (isFlightLeg && !showFlightLegs) continue;
                    const seg = [[stops[i].lat, stops[i].lng], [stops[i + 1].lat, stops[i + 1].lng]];
                    L.polyline(seg, isFlightLeg ? { color:'#3B5B8C',weight:2.5,opacity:.82 } : { color:'#8B6A50',weight:3,dashArray:'5 5',opacity:.8 }).addTo(group);
                }
                map.fitBounds(L.latLngBounds(latlngs), { padding: [28, 28], maxZoom: 15 });
                setTimeout(() => map.invalidateSize(), 100);
            }, [stops]);

            const totalCount = (timelineItems || []).length;
            const navigationUrl = (() => {
                const groundNavigationStops = stops.filter(stop => stop.kind === 'spot');
                if (!groundNavigationStops.length) return 'https://maps.google.com';
                const point = stop => encodeURIComponent(Number.isFinite(stop.lat) && Number.isFinite(stop.lng) ? `${stop.lat},${stop.lng}` : String(stop.title || '').replace(/^✈️\s*/,''));
                if (groundNavigationStops.length === 1) return `https://www.google.com/maps/search/?api=1&query=${point(groundNavigationStops[0])}`;
                const waypoints = groundNavigationStops.slice(1,-1).map(point).join('%7C');
                return `https://www.google.com/maps/dir/?api=1&origin=${point(groundNavigationStops[0])}&destination=${point(groundNavigationStops[groundNavigationStops.length-1])}${waypoints ? `&waypoints=${waypoints}` : ''}`;
            })();

            return <section className="theme-route-estimate mt-5 bg-white rounded-card border border-earth-100 shadow-sm overflow-hidden relative z-0 isolate">
                <div className="p-3.5 border-b border-earth-100"><div className="flex items-center justify-between gap-2"><h3 className="font-serif font-bold text-sm text-earth-800"><i className="fa-solid fa-map-location-dot text-accent mr-1.5"></i>當日路線與交通估算</h3><a href={navigationUrl} target="_blank" rel="noopener noreferrer" className="min-h-8 shrink-0 inline-flex items-center gap-1 text-[10px] font-bold text-accent hover:underline"><i className="fa-solid fa-diamond-turn-right"></i>Google Maps 導航</a></div><p className="text-[10px] text-earth-500 mt-1">優先顯示行程中手動校正的距離、時間與費用；未校正項目才使用路線估算。</p></div>
                {totalCount < 2 ? <div className="px-4 py-7 text-center text-[11px] text-earth-400">加入至少兩個行程點（含班機）後，即可查看地圖與交通時間。</div> : <>
                    <div className="h-52 bg-earth-50 relative isolate z-0">{mapStops.length ? <div ref={mapRef} className="h-full w-full relative z-0"></div> : <div className="h-full flex items-center justify-center px-8 text-center text-[11px] text-earth-400">此日行程尚未設定位置，請編輯行程點或選擇有座標資料的機場。</div>}</div>
                    <div className="p-3 space-y-2.5">{stops.slice(0, -1).map((from, index) => {
                        const to = stops[index + 1];
                        const isFlightLeg = from.kind === 'flight-from' && to.kind === 'flight-to' && from.flight.id === to.flight.id;
                        const segmentKey = `${from.key}__${to.key}`;
                        if (from.lat == null || to.lat == null) return <div key={segmentKey} className="rounded-btn bg-earth-50 border border-earth-100 p-2.5 text-xs text-earth-600 break-words">{from.title} → {to.title}<div className="mt-1 text-earth-400">缺少位置，暫不估算這一段距離與時間</div></div>;
                        if (isFlightLeg) {
                            if (!showFlightLegs) return null;
                            const km=distanceKm(from,to);
                            return <div key={segmentKey} className="rounded-btn border border-blue-100 bg-blue-50 p-2"><div className="flex flex-wrap items-center gap-x-1.5 gap-y-1 text-[10px] font-bold text-earth-700"><span className="min-w-0 break-words">{from.title}</span><i className="fa-solid fa-plane shrink-0 text-blue-400"></i><span className="min-w-0 break-words">{to.title}</span><span className="basis-full text-right text-[9px] font-semibold text-earth-500 sm:basis-auto sm:ml-auto">轉機航段 · 約 {km.toFixed(0)} km</span></div></div>;
                        }
                        const type = to.kind === 'spot' ? (to.ref.transportType || '大眾運輸') : (manualTransport[segmentKey] || '大眾運輸');
                        const estimated = estimate(from, to, type);
                        const correctedKm = to.kind === 'spot' && Number(to.ref.routeDistanceKm) > 0 ? Number(to.ref.routeDistanceKm) : null;
                        const correctedMinutesValue = to.kind === 'spot' && to.ref.routeDuration ? Number(String(to.ref.routeDuration).match(/[\d.]+/)?.[0]) : NaN;
                        const correctedMins = Number.isFinite(correctedMinutesValue) ? correctedMinutesValue : null;
                        const measure = { km:correctedKm ?? estimated.km, mins:correctedMins ?? estimated.mins };
                        const correctedFare = to.kind === 'spot' ? Number(to.ref.actualFare !== '' && to.ref.actualFare != null ? to.ref.actualFare : to.ref.fare || 0) : 0;
                        return <div key={segmentKey} className="rounded-btn bg-earth-50 border border-earth-100 p-2.5">
                            <div className="mb-2 flex min-w-0 items-start gap-1.5 text-[11px] font-bold leading-snug text-earth-700"><span className="min-w-0 break-words">{from.title}</span><i className="fa-solid fa-arrow-right mt-0.5 shrink-0 text-[9px] text-earth-400"></i><span className="min-w-0 break-words">{to.title}</span></div>
                            <div className="flex items-center justify-between gap-2">
                                <div className="theme-transport-options flex gap-1">{Object.entries(transport).map(([name, config]) => <button type="button" key={name} title={name} aria-label={`交通方式：${name}`} onClick={() => setTransport(segmentKey, to, name)} className={`flex h-11 min-w-10 shrink-0 flex-col items-center justify-center rounded px-1 text-[8px] font-bold leading-none transition ${type === name ? 'bg-earth-800 text-white shadow-sm' : 'bg-white text-earth-500 border border-earth-200'}`}><i className={`fa-solid ${config.icon} mb-1 text-[18px]`}></i><span>{name==='大眾運輸'?'大眾':name}</span></button>)}</div>
                                <div className="min-w-[7.4rem] text-right text-[10px] leading-tight"><div className="flex items-baseline justify-end gap-2 whitespace-nowrap text-[14px] font-black text-earth-800"><span>{measure.km.toFixed(1)} km</span><span>約 {measure.mins} 分</span></div>{correctedFare > 0 && <div className="mt-1 font-semibold text-accent">校正 {getCurrencySymbol(to.ref.transportCurrency || to.ref.priceCurrency || 'local','¥')} {correctedFare.toFixed(2)}</div>}</div>
                            </div>
                        </div>;
                    })}</div>
                    {missingCoordsFlights.length > 0 && <div className="px-3 pb-3 text-[9px] text-earth-400">{missingCoordsFlights.map(f=>`${f.flightNo||f.airline||'班機'}`).join('、')} 的機場暫無座標資料，無法顯示於地圖或估算距離。</div>}
                </>}
            </section>;
        };

        const DailyView = ({ nav, activeData, updateData, selectedDate, setSelectedDate, dates, journeys, copyToJourney, moveToJourney, formatCurrency }) => {
            const [modalMode, setModalMode] = useState(null);
            const [copyTarget, setCopyTarget] = useState(null);
            const [showPassModal, setShowPassModal] = useState(false);
            const [batchMode, setBatchMode] = useState(false);
            const [selectedSpotIds, setSelectedSpotIds] = useState([]);
            const spots = activeData.spots;
            const passes = activeData.passes || [];
            window.__wandererPasses = passes;
            const customPayments = activeData.customPayments || [];
            const customCategories = activeData.customCategories || [];
            const tripCurrencyCode = getJourneyCurrencyCode(activeData.info);
            const allFlights = activeData.flights || [];
            const sameDaySpots = spots.filter(s => s.date === selectedDate);
            const currentFlights = allFlights.filter(f => f.date === selectedDate);
            const hasArrivalFlight = currentFlights.some(f => ['departure','connection','transfer'].includes(f.type));
            const accommodationGroups = [...new Map(sameDaySpots.filter(s => s.type === 'accommodation' && s.lodgingGroupId).map(s => [s.lodgingGroupId, s])).values()];
            const seenLodgingCards = new Set();
            const currentSpots = sameDaySpots.filter(s => {
                if (s.type === 'accommodation' && s.lodgingGroupId && s.lodgingSlot === 'morning' && Number(s.lodgingNight) === 1 && sameDaySpots.some(other => other.lodgingGroupId === s.lodgingGroupId && other.lodgingSlot === 'evening')) return false;
                if (s.type !== 'accommodation' || !s.lodgingGroupId || accommodationGroups.length < 2) return true;
                // On a hotel-change day, keep the previous hotel's departure and the
                // new hotel's arrival. Group IDs reflect creation time, not stay order.
                return s.lodgingSlot === 'morning' ? Number(s.lodgingNight) > 1 : Number(s.lodgingNight) === 1;
            }).sort((a, b) => {
                const rank = x => x.type === 'accommodation' && x.lodgingSlot === 'morning' ? (hasArrivalFlight ? 0 : -1) : (x.type === 'accommodation' && x.lodgingSlot === 'evening' ? 1 : 0);
                const rankDiff = rank(a) - rank(b);
                return rankDiff || (a.time || '99:99').localeCompare(b.time || '99:99');
            }).filter(item => {
                if (!item.lodgingGroupId || !item.lodgingSlot) return true;
                const key = `${item.date}|${item.lodgingSlot}|${item.title.replace(/｜.*$/, '').trim()}`;
                if (seenLodgingCards.has(key)) return false;
                seenLodgingCards.add(key);
                return true;
            });
            // Flights are stored once in activeData.flights; deriving them here (rather than
            // duplicating into the day's schedule) means editing a flight in 班機資料管理
            // instantly reflects here, and vice versa — there's only one source of truth.
            const flightDateSet = useMemo(() => new Set(allFlights.map(f => f.date).filter(Boolean)), [allFlights]);
            // Merge spots + flights into one chronological timeline for the selected day.
            const timelineItems = useMemo(() => {
                const items = [
                    ...currentSpots.map(s => ({ kind: 'spot', time: s.time || '', data: s })),
                    ...currentFlights.map(f => ({ kind: 'flight', time: f.time || '', data: f })),
                ];
                const hasArrival = currentFlights.some(f => ['departure','connection','transfer'].includes(f.type));
                return items.sort((a, b) => {
                    if (!hasArrival) {
                        const rank = item => item.kind === 'spot' && item.data.type === 'accommodation' ? (item.data.lodgingSlot === 'morning' ? -1 : item.data.lodgingSlot === 'evening' ? 1 : 0) : 0;
                        const order = rank(a) - rank(b);
                        if (order) return order;
                    }
                    return (a.time || '99:99').localeCompare(b.time || '99:99');
                });
            }, [currentSpots, currentFlights]);

            const activePassBanners = useMemo(() => {
                const banners = [];
                passes.forEach(pass => {
                    const day = getPassUsageDay(pass, selectedDate, spots, allFlights);
                    if (day) banners.push({ id: pass.id, name: pass.name, type:pass.type, currentDay: day, total: Math.max(1, Number(pass.days) || 1) });
                });
                return banners;
            }, [passes, spots, allFlights, selectedDate]);
            const passUsageForSpot = (spot) => {
                const passName = String(spot.paymentMethod || '');
                const pass = passes.find(p => spotUsesPass(spot, p));
                if (!pass || !spot.date) return null;
                const day = getPassUsageDay(pass, spot.date, spots, allFlights);
                if (!day) return null;
                return `使用第 ${day} 日 / 共 ${pass.days} 日`;
            };
            const passUsageForFlight = (flight) => {
                const pass = passes.find(p => String(p.id) === String(flight.groundPassId));
                if (!pass || !flight.date) return null;
                const day = getPassUsageDay(pass, flight.date, spots, allFlights);
                return day ? `使用第 ${day} 日 / 共 ${pass.days} 日` : null;
            };
            const toggleBatchSpot = (id) => setSelectedSpotIds(current => current.map(String).includes(String(id)) ? current.filter(item => String(item) !== String(id)) : [...current, id]);
            const selectedBatchSpots = spots.filter(spot => selectedSpotIds.map(String).includes(String(spot.id)));
            const clearBatch = () => { setSelectedSpotIds([]); setBatchMode(false); };
            const moveBatchToDate = () => {
                if (!selectedBatchSpots.length) return;
                const answer = window.prompt(`請輸入要移動到的日期或 Day 編號：\n${dates.map((item,index)=>`${index+1}. ${item.day}｜${item.label}`).join('\n')}`);
                if (!answer) return;
                const index = Number(answer) - 1;
                const target = dates[index]?.date || dates.find(item => item.date === answer.trim())?.date;
                if (!target) return alert('找不到指定日期。');
                if (!window.confirm(`確定將選取的 ${selectedBatchSpots.length} 筆行程移動到 ${target} 嗎？`)) return;
                updateData({spots:spots.map(spot=>selectedSpotIds.map(String).includes(String(spot.id))?{...spot,date:target}:spot),bills:(activeData.bills||[]).map(bill=>selectedSpotIds.map(String).includes(String(bill.sourceSpotId))?{...bill,date:target}:bill)});
                clearBatch();
            };
            const moveBatchToBackup = () => {
                if (!selectedBatchSpots.length || !window.confirm(`確定將選取的 ${selectedBatchSpots.length} 筆行程移到備用行程嗎？`)) return;
                const ids = selectedSpotIds.map(String);
                updateData({spots:spots.filter(spot=>!ids.includes(String(spot.id))),backupSpots:[...(activeData.backupSpots||[]),...selectedBatchSpots.map(spot=>({...spot,date:null}))],bills:(activeData.bills||[]).filter(bill=>!ids.includes(String(bill.sourceSpotId)))});
                clearBatch();
            };
            const deleteBatch = () => {
                if (!selectedBatchSpots.length || !window.confirm(`確定刪除選取的 ${selectedBatchSpots.length} 筆行程嗎？`)) return;
                const ids = selectedSpotIds.map(String);
                updateData({spots:spots.filter(spot=>!ids.includes(String(spot.id))),deletedSpotIds:[...(activeData.deletedSpotIds||[]),...selectedSpotIds],bills:(activeData.bills||[]).filter(bill=>!ids.includes(String(bill.sourceSpotId)))});
                clearBatch();
            };
            const timelinePointTitle = (item) => item?.kind === 'flight'
                ? `${item.data.to || item.data.toAirport || item.data.destination || '機場'}${item.data.arrivalTerminal ? ` ${item.data.arrivalTerminal}` : ''}`
                : (item?.data?.title || '').replace(/｜.*$/, '') || '';
            const timelinePointCoords = (item) => item?.kind === 'flight' ? getAirportCoords(item.data.to) : (item?.data?.lat != null && item?.data?.lng != null ? { lat:Number(item.data.lat), lng:Number(item.data.lng) } : null);
            const flightGroundRoute = (index, flight) => {
                const next = timelineItems[index + 1], previous = timelineItems[index - 1];
                const arrivalAirport = getAirportCoords(flight.to), departureAirport = getAirportCoords(flight.from);
                const nextCoords = timelinePointCoords(next), previousCoords = timelinePointCoords(previous);
                if (arrivalAirport && nextCoords) return { from:arrivalAirport, to:nextCoords };
                if (previousCoords && departureAirport) return { from:previousCoords, to:departureAirport };
                return null;
            };
            const previousPointForModal = () => {
                const editIndex = typeof modalMode === 'object' ? timelineItems.findIndex(item => item.kind === 'spot' && item.data.id === modalMode.id) : -1;
                const previous = timelineItems[editIndex >= 0 ? editIndex - 1 : timelineItems.length - 1];
                const title = timelinePointTitle(previous);
                return title ? { title, ...timelinePointCoords(previous) } : null;
            };
            const spotWithLinkedFlightTransport = (index, spot) => {
                const explicitlyLinkedFlight = allFlights.find(f => String(f.id) === String(spot.linkedFlightTransportId));
                const adjacentFlight = explicitlyLinkedFlight || (timelineItems[index - 1]?.kind === 'flight' ? timelineItems[index - 1].data : timelineItems[index + 1]?.kind === 'flight' ? timelineItems[index + 1].data : null);
                if (!adjacentFlight) return spot;
                return adjacentFlight.groundTransport ? { ...spot, ...flightGroundToSpot(adjacentFlight), linkedFlightTransportId:adjacentFlight.id } : { ...spot, linkedFlightTransportId:adjacentFlight.id };
            };
            const linkedSpotForFlight = (index, flightId) => spots.find(s => String(s.linkedFlightTransportId) === String(flightId)) || (timelineItems[index + 1]?.kind === 'spot' ? timelineItems[index + 1].data : timelineItems[index - 1]?.kind === 'spot' ? timelineItems[index - 1].data : null);
            const flightWithLinkedSpotTransport = (index, flight) => {
                const linked=linkedSpotForFlight(index,flight.id);
                return !flight.groundTransport && linked?.transportType ? { ...flight, ...spotTransportToFlight(linked) } : flight;
            };

            return (
                <div className="space-y-4 animate-fadeIn pb-6">
                    <div className="-mx-4 px-4 pt-2 overflow-x-auto scrollbar-hide pb-1">
                        <div className="theme-date-strip flex gap-2 w-max items-center">
                            <button onClick={() => setShowPassModal(true)} className="flex flex-col items-center justify-center w-14 h-14 rounded-card border-2 border-dashed border-accent text-accent hover:bg-accent hover:text-white transition shadow-sm bg-white shrink-0">
                                <i className="fa-solid fa-ticket text-sm mb-0.5"></i><span className="text-[8px] font-bold">交通票券</span>

            useEffect(() => {

                const dLat = rad(groundRoute.to.lat-groundRoute.from.lat), dLng = rad(groundRoute.to.lng-groundRoute.from.lng);
                const h = Math.sin(dLat/2)**2 + Math.cos(rad(groundRoute.from.lat))*Math.cos(rad(groundRoute.to.lat))*Math.sin(dLng/2)**2;
                const directKm = 6371*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
                const km = Number((directKm*(type==='步行'?1.18:1.3)).toFixed(1));

                const departure = f.groundDepartureTime || '';
                const arrival = /^\d{2}:\d{2}$/.test(departure) ? `${String((Number(departure.slice(0,2))+Math.floor((Number(departure.slice(3))+minutes)/60))%24).padStart(2,'0')}:${String((Number(departure.slice(3))+minutes)%60).padStart(2,'0')}` : '';
                const duration = `約 ${minutes} 分`;

                    <div className="flex items-center gap-2">
                    <button type="button" onClick={()=>type&&setShowDetails(value=>!value)} className="flex flex-1 min-w-0 items-start gap-2.5 text-left"><div className="mt-0.5 w-8 h-8 rounded-full bg-white/10 flex items-center justify-center shrink-0"><i className="fa-solid fa-plane text-accent-light text-xs"></i></div><div className="min-w-0 flex-1"><div className="flex items-baseline gap-1.5 whitespace-nowrap"><span className="text-[15px] font-black tracking-wide">{f.from?.split(' ')[0]||'?'}</span><span className="text-[13px] font-semibold">{f.time||'--:--'}</span><i className="fa-solid fa-arrow-right text-[9px] text-earth-400"></i><span className="text-[15px] font-black tracking-wide">{f.to?.split(' ')[0]||'?'}</span><span className="text-[13px] font-semibold">{f.arrivalTime||'--:--'}</span></div><div className="mt-0.5 truncate text-[10px] font-medium text-earth-200">{[f.airline,f.flightNo].filter(Boolean).join(' · ')||'尚未填寫航空公司與航班編號'}</div><div className="mt-1 flex flex-wrap gap-x-2 gap-y-0.5 text-[9px] font-normal text-earth-400">{(f.departureTerminal||f.arrivalTerminal)&&<span>{f.departureTerminal||'—'} → {f.arrivalTerminal||'—'}</span>}{f.time&&f.arrivalTime&&<span>{clockDuration(f.time,f.arrivalTime)}</span>}{f.seat&&<span>座位 {f.seat}</span>}{f.gate&&<span>登機門 {f.gate}</span>}</div></div></button>

                    {(f.groundRoadType || selectedPass || f.groundPassAllowed || passUsage) && <div>{f.groundRoadType ? `道路：${f.groundRoadType}` : ''}{selectedPass ? ` · 交通券：${selectedPass.name}` : (f.groundPassAllowed ? ' · 交通券：可使用' : '')}{passUsage ? ` · ${passUsage}` : ''}</div>}
                    {publicTransit && <div>交通工具：{f.groundTransitVehicle || (type === '機場快線' ? '機場快線' : '未填')} · 路線：{f.groundTransitName || '未填'}{['火車','機場快線','渡輪'].includes(f.groundTransitVehicle || (type === '機場快線' ? '機場快線' : '')) ? ` · 席別：${f.groundSeatType || '未填'} · 車廂：${f.groundCarriage || '未填'} · 座位：${f.groundSeatNumber || '未填'}` : ''}</div>}
                    {publicTransit && !selectedPass && groundTickets.filter(t=>Number(t.price)>0).map((t,index)=><div key={`flight-ticket-${index}`}>{t.name}：{getCurrencySymbol(t.currency||groundCurrency,currencySymbol)} {Number(t.price).toFixed(2)}／人</div>)}
                    {type === '計程車' && <div>上車：{f.groundPickup || '未填'} · 下車：{f.groundDropoff || '未填'} · 車型：{f.groundCarSize || '小車'}{estimatedTaxi ? ` · 預估車資：${groundSymbol}${Number(estimatedTaxi).toFixed(2)}` : ''}</div>}

                    {type === '步行' && <div>推薦路線：{f.groundWalkingRoute || '請開啟地圖導航查看'}</div>}
                </div></div>}

                    {publicTransit && <><select value={f.groundTransitVehicle || (type === '機場快線' ? '機場快線－一般快車' : '')} onChange={e=>update('groundTransitVehicle',e.target.value)} className="col-span-2 rounded p-2 text-xs text-earth-800"><option value="">依旅程國家選擇交通工具／車種</option>{transitOptionsForCountry(tripCountry).map(name=><option key={name}>{name}</option>)}</select><select value={f.groundPassId || ''} onChange={e=>onTransportChange({ groundPassId: e.target.value || '', groundPassAllowed: !!e.target.value })} className="col-span-2 rounded p-2 text-xs text-earth-800"><option value="">不使用交通券</option>{(window.__wandererPasses || []).map(p=><option key={p.id} value={p.id}>{p.name}（{p.type === 'continuous' ? `連續 ${p.days} 天` : `任選 ${p.days} 天`}）</option>)}</select><input value={f.groundTransitName || ''} onChange={e=>update('groundTransitName', e.target.value)} placeholder="路線／車次（如 Skyliner 12 號）" className="col-span-2 rounded p-2 text-xs text-earth-800"/>{/(火車|列車|高鐵|新幹線|KTX|機場快線|AREX|渡輪)/.test(f.groundTransitVehicle || (type === '機場快線' ? '機場快線' : '')) && <><div className="col-span-2 flex flex-wrap gap-2">{['指定席','自由座'].map(seat=><button type="button" key={seat} onClick={()=>update('groundSeatType',seat)} className={`min-h-9 px-3 rounded text-xs font-bold ${f.groundSeatType===seat?'bg-accent text-white':'bg-white text-earth-700'}`}>{seat}</button>)}</div><input value={f.groundCarriage || ''} onChange={e=>update('groundCarriage',e.target.value)} placeholder="車廂" className="rounded p-2 text-xs text-earth-800"/><input value={f.groundSeatNumber || ''} onChange={e=>update('groundSeatNumber',e.target.value)} placeholder="座位" className="rounded p-2 text-xs text-earth-800"/></>}</>}

                    {type === '自駕' && <><select value={f.groundRoadType || '普通道路'} onChange={e=>update('groundRoadType',e.target.value)} className="rounded p-1.5 text-[10px] text-earth-800"><option>高速公路</option><option>普通道路</option></select><input type="number" min="0" value={estimatedToll} onChange={e=>update('groundToll',e.target.value)} placeholder="過路費估算" className="rounded p-1.5 text-[10px] text-earth-800"/><input type="number" min="0" value={f.groundFare || ''} onChange={e=>update('groundFare',e.target.value)} placeholder="預估車資" className="rounded p-1.5 text-[10px] text-earth-800"/></>}
                    {type === '步行' && <><input value={f.groundWalkingRoute || ''} onChange={e=>update('groundWalkingRoute',e.target.value)} placeholder="推薦步行路線（可依地圖導航填入）" className="col-span-2 rounded p-1.5 text-[10px] text-earth-800"/><button type="button" onClick={()=>window.open(`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(f.from || '')}&destination=${encodeURIComponent(f.to || '')}&travelmode=walking`, '_blank')} className="col-span-2 rounded bg-white text-earth-700 py-1.5 text-[9px] font-bold"><i className="fa-solid fa-map-location-dot mr-1"></i>開啟推薦步行導航</button><div className="col-span-2 text-[9px] text-earth-200"><i className="fa-solid fa-person-walking mr-1"></i>{f.groundWalkingRoute || '尚未設定推薦路線，請開啟地圖導航查看。'}</div></>}
                    {type === '計程車' && <><input value={f.groundPickup || ''} onChange={e=>update('groundPickup',e.target.value)} placeholder="建議上車地點" className="rounded p-1.5 text-[10px] text-earth-800"/><input value={f.groundDropoff || ''} onChange={e=>update('groundDropoff',e.target.value)} placeholder="建議下車地點" className="rounded p-1.5 text-[10px] text-earth-800"/><input type="number" min="0" value={estimatedTaxi} onChange={e=>update('groundFare',e.target.value)} placeholder="預估車資" className="rounded p-1.5 text-[10px] text-earth-800"/><select value={f.groundCarSize || '小車'} onChange={e=>update('groundCarSize',e.target.value)} className="rounded p-1.5 text-[10px] text-earth-800"><option>小車</option><option>大車</option></select><div className="col-span-2 flex gap-1"><input type="number" min="1" value={f.groundCapacity || ''} onChange={e=>update('groundCapacity',e.target.value)} placeholder="可搭乘人數" className="flex-1 rounded p-1.5 text-[10px] text-earth-800"/><input type="number" min="0" value={f.groundLuggage || ''} onChange={e=>update('groundLuggage',e.target.value)} placeholder="可放行李件數" className="flex-1 rounded p-1.5 text-[10px] text-earth-800"/></div><input type="number" min="0" value={f.groundSurcharge || ''} onChange={e=>update('groundSurcharge',e.target.value)} placeholder="大型車／行李等加成費用" className="col-span-2 rounded p-1.5 text-[10px] text-earth-800"/></>}
                    {type === '包車' && <><input value={f.groundPickup||''} onChange={e=>update('groundPickup',e.target.value)} placeholder="上車地點" className="min-w-0 rounded p-2 text-xs text-earth-800"/><input value={f.groundDropoff||''} onChange={e=>update('groundDropoff',e.target.value)} placeholder="下車地點" className="min-w-0 rounded p-2 text-xs text-earth-800"/><input type="date" value={f.groundServiceDate||f.date||''} onChange={e=>update('groundServiceDate',e.target.value)} className="min-w-0 rounded p-2 text-xs text-earth-800"/><input value={f.groundCharterHours||''} onChange={e=>update('groundCharterHours',e.target.value)} placeholder="使用時數" className="min-w-0 rounded p-2 text-xs text-earth-800"/><input value={f.groundCarSize||''} onChange={e=>update('groundCarSize',e.target.value)} placeholder="車型" className="min-w-0 rounded p-2 text-xs text-earth-800"/><input type="number" value={f.groundCapacity||''} onChange={e=>update('groundCapacity',e.target.value)} placeholder="可搭乘人數" className="min-w-0 rounded p-2 text-xs text-earth-800"/><input type="number" value={f.groundLuggage||''} onChange={e=>update('groundLuggage',e.target.value)} placeholder="行李件數" className="min-w-0 rounded p-2 text-xs text-earth-800"/>{[['groundCharterBase','基本費用'],['groundCharterOvertime','超時費'],['groundToll','ETC／過路費'],['groundParking','停車費'],['groundExtra','其他費用']].map(([key,label])=><input key={key} type="number" min="0" value={f[key]||''} onChange={e=>update(key,e.target.value)} placeholder={label} className="min-w-0 rounded p-2 text-xs text-earth-800"/>)}<div className="col-span-2 text-xs font-bold">總費用 {dualAmount(charterTotal)}</div></>}
                    {['自駕','計程車','包車'].includes(type) && <div className={`col-span-2 grid gap-2 ${type === '計程車' ? 'grid-cols-2' : 'grid-cols-1'}`}>{type === '計程車' && <label className="text-[9px] font-bold text-earth-200">過路費估算<input type="number" min="0" value={f.groundToll || ''} onChange={e=>update('groundToll',e.target.value)} placeholder="選填" className="mt-0.5 w-full min-w-0 rounded p-2 text-xs"/></label>}<label className="text-[9px] font-bold text-earth-200">費用幣別<CurrencyPicker value={groundCurrency} onChange={value=>update('groundCurrency',value)} localSymbol={currencySymbol} className="mt-0.5 rounded p-2 text-xs"/></label></div>}
                </div>}
            </div>;
        };

        const CopySpotModal = ({ action='copy', spot, journeys, currentJourneyId, currentDate, onClose, onCopy, onMove }) => {
            const currentJourney = journeys.find(j => j.id === currentJourneyId) || journeys[0];

            return <div className="fixed inset-0 z-[80] flex items-end justify-center bg-earth-900/60 backdrop-blur-sm">
                <div className="modal-container w-full max-w-[480px]"><div className="flex justify-between items-center p-3.5 border-b border-earth-100 bg-earth-50"><button onClick={onClose} className="px-3 py-1.5 text-earth-600 text-[11px] font-bold bg-earth-200/50 rounded-btn">取消</button><h3 className="font-serif font-bold text-sm text-earth-800">{action === 'copy' ? '複製行程' : '移動他日'}</h3><button onClick={() => {if(!window.confirm(`確定要${action==='copy'?'複製':'移動'}「${spot.title}」嗎？`))return;action === 'copy' ? onCopy(journeyId, date) : onMove(journeyId, date);}} className="px-4 py-1.5 bg-earth-800 text-white text-[11px] font-bold rounded-btn">{action === 'copy' ? '複製' : '移動'}</button></div>
                    <div className="modal-content space-y-3"><div className="rounded-card bg-earth-50 border border-earth-100 p-3"><div className="text-[10px] text-earth-500 font-semibold">選取的行程</div><div className="font-semibold text-earth-800 text-sm mt-1">{spot.title}</div></div><div><label className="text-[10px] font-semibold text-earth-500 mb-1 block">目標旅程</label><select value={journeyId} onChange={e => { const id = e.target.value; setJourneyId(id); const j = journeys.find(item => String(item.id) === String(id)); setDate(j?.info.startDate || date); }} className="w-full border border-earth-200 rounded-btn p-2 text-xs">{journeys.map(j => <option key={j.id} value={j.id}>{j.info.title}</option>)}</select></div><div><label className="text-[10px] font-semibold text-earth-500 mb-1 block">目標日期</label><select value={date} onChange={e => setDate(e.target.value)} className="w-full border border-earth-200 rounded-btn p-2 text-xs">{targetDates.map(d => <option key={d.date} value={d.date}>{d.date}（{d.day}）</option>)}</select>{action === 'copy' && <p className="mt-1 text-[10px] text-earth-400">選擇目前日期會在同一天建立另一張獨立小卡。</p>}</div></div>
                </div></div>;
        };

        const SpotCard = ({ spot, batchMode=false, batchSelected=false, onBatchToggle, hideTransport=false, routeFrom, transitPassName, passUsage, formatCurrency, symbol, exchangeRate=1, tripCurrencyCode='', onEdit, onDelete, onCopy, onMove, onBackup }) => {
            const [showMenu, setShowMenu] = useState(false);
            const menuRef = useRef(null);
            const touchStartX=useRef(0);
            useEffect(() => {
                const closeOther = event => { if (!batchMode && String(event.detail) !== String(spot.id)) setShowMenu(false); };
                const closeOutside = event => { if (!batchMode && menuRef.current && !menuRef.current.contains(event.target)) setShowMenu(false); };
                window.addEventListener('wanderer-open-spot-menu', closeOther);
                document.addEventListener('pointerdown', closeOutside);
                return () => { window.removeEventListener('wanderer-open-spot-menu', closeOther); document.removeEventListener('pointerdown', closeOutside); };
            }, [spot.id,batchMode]);
            useEffect(()=>{setShowMenu(batchMode);},[batchMode]);
            const sharedMapUrl = (() => { try { return spot.mapUrl ? parseSharedMapLink(spot.mapUrl).url : null; } catch { return null; } })();
            const getIcon = (type) => ({ accommodation: 'fa-bed', attraction: 'fa-camera-retro', food: 'fa-utensils', shopping: 'fa-bag-shopping', meeting: 'fa-location-dot', activity:'fa-ticket' }[type] || spot.customIcon || 'fa-star');
            const currencyRates = { local: Number(exchangeRate || 1), twd: 1, usd: 32, eur: 35, jpy: 0.22, krw: 0.024, cny: 4.45, hkd: 4.1, sgd: 24, thb: 0.9, vnd: 0.0013, myr: 7.2, idr: 0.002, php: 0.58, aud: 21, nzd: 19, cad: 23, chf: 36, gbp: 41, sek: 3.1, nok: 3, dkk: 4.7, inr: 0.38, aed: 8.7, try: 0.9, brl: 6.1, zar: 1.8, mxn: 1.9, pln: 8.1, czk: 1.4, huf: 0.08, ...(tripCurrencyCode ? { [tripCurrencyCode]: Number(exchangeRate || 1) } : {}) };
            const toLocal = (amount, currency='local') => Number(amount || 0) * (currencyRates[currency] || currencyRates.local) / Number(exchangeRate || 1);
            const getDisplayPrice = () => {
                if (spot.type === 'accommodation' && spot.pricePerNight) return (spot.isScheduleCopy || (spot.lodgingGroupId && spot.lodgingSlot !== 'evening')) ? 0 : toLocal(spot.pricePerNight, spot.priceCurrency) * (spot.nights || 1);
                if (['attraction','activity'].includes(spot.type) && spot.tickets) return spot.tickets.reduce((sum, t) => sum + toLocal(t.price, t.currency) * Math.max(1, Number(t.count) || 1), 0);
                return toLocal(spot.price, spot.priceCurrency);
            };
            const displayPrice = getDisplayPrice();
            const localAmount = (amount) => `${symbol} ${Number(amount || 0).toFixed(2)}`;
            const twdAmount = (amount) => `NT$ ${(Number(amount || 0) * Number(exchangeRate || 1)).toFixed(2)}`;
            const ticketCurrency = ['attraction','activity'].includes(spot.type) ? spot.tickets?.find(t=>Number(t.price)>0)?.currency : null;
            const primaryCurrency = ticketCurrency || spot.priceCurrency || 'local';
            const primarySymbol = getCurrencySymbol(primaryCurrency, symbol);
            const rawPrimaryPrice = spot.type === 'accommodation' ? Number(spot.pricePerNight || 0) * Math.max(1, Number(spot.nights || 1)) : Number(spot.price || 0);
            const primaryRate = currencyRates[primaryCurrency] || currencyRates.local;

                                    <h4 className="font-bold text-earth-800 text-xs border-b border-earth-100 pb-2 mb-2">{editing.id ? '編輯票券' : '新增票券'}</h4>
                                    <div><label className="text-[10px] font-bold text-earth-500 mb-1 block">票券名稱 <span className="text-red-400">*</span></label><input type="text" value={editing.name} onChange={e=>setEditing({...editing, name: e.target.value})} className="w-full border p-2 rounded-btn text-xs" required/></div>
                                    <p className="rounded-btn bg-blue-50 px-2.5 py-2 text-[10px] font-semibold leading-relaxed text-blue-700">自動啟用會跟隨第一次使用交通券的行程日期；移動行程後，使用 Day 會一起更新。</p>
                                    <div className="grid grid-cols-2 gap-2"><label className="text-[10px] font-bold text-earth-500">啟用方式<select value={editing.activationMode||'first_use'} onChange={e=>setEditing({...editing,activationMode:e.target.value,startDate:e.target.value==='fixed'?editing.startDate:''})} className="mt-1 w-full border p-2 rounded-btn text-xs"><option value="first_use">第一次使用時自動啟用</option><option value="fixed">固定日期</option></select></label>{editing.activationMode==='fixed'&&<label className="text-[10px] font-bold text-earth-500">固定啟用日期<input type="date" value={editing.startDate||''} onChange={e=>setEditing({...editing,startDate:e.target.value})} className="mt-1 w-full border p-2 rounded-btn text-xs"/></label>}</div>
                                    <div><label className="text-xs font-bold text-earth-500 mb-1 block">購買費用</label><div className="grid grid-cols-2 gap-2"><input type="number" min="0" value={editing.price || ''} onChange={e=>setEditing({...editing, price: e.target.value})} placeholder="輸入購買金額" className="min-w-0 border p-2 rounded-btn text-xs"/><CurrencyPicker value={editing.priceCurrency || 'local'} onChange={value=>setEditing({...editing, priceCurrency:value})} localSymbol={currencySymbol}/></div></div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div><label className="text-[10px] font-bold text-earth-500 mb-1 block">類型</label><select value={editing.type} onChange={e=>setEditing({...editing, type: e.target.value})} className="w-full border p-2 rounded-btn text-xs"><option value="continuous">連續天數</option><option value="flexible">任選天數</option></select></div>
                                        <div><label className="text-[10px] font-bold text-earth-500 mb-1 block">有效天數</label><input type="number" value={editing.days} onChange={e=>setEditing({...editing, days: parseInt(e.target.value)||1})} className="w-full border p-2 rounded-btn text-xs" required/></div>
                                    </div>
                                    <div><label className="text-[10px] font-bold text-earth-500 mb-1 block">備註</label><input type="text" value={editing.remark||''} onChange={e=>setEditing({...editing, remark: e.target.value})} className="w-full border p-2 rounded-btn text-xs"/></div>
                                    <div className="flex gap-2 pt-2"><button onClick={()=>setEditing(null)} className="flex-1 py-1.5 text-earth-600 bg-earth-100 text-[11px] font-bold rounded-btn hover:bg-earth-200"><i className="fa-solid fa-arrow-left mr-1"></i>返回票券列表</button><button onClick={handleSave} disabled={!editing.name} className="flex-1 py-1.5 bg-earth-800 text-white text-[11px] font-bold rounded-btn disabled:opacity-50">儲存</button></div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // Tap-to-pin on a real map — the most convenient fallback when name/address search
        // fails, since it needs no typing and works even if the geocoding service is down or
        // rate-limited. Centers on the existing pin if there is one, otherwise a wide world view.
        const MapPinPicker = ({ lat, lng, onPick }) => {
            const mapRef = useRef(null);
            const mapInstance = useRef(null);
            const markerRef = useRef(null);

            useEffect(() => {
                if (!mapRef.current || mapInstance.current) return;
                const startLat = Number.isFinite(lat) ? lat : 23.5;
                const startLng = Number.isFinite(lng) ? lng : 121;
                mapInstance.current = L.map(mapRef.current, { attributionControl: true }).setView([startLat, startLng], Number.isFinite(lat) ? 15 : 3);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 20, attribution:'&copy; OpenStreetMap contributors &copy; CARTO' }).addTo(mapInstance.current);
                if (Number.isFinite(lat) && Number.isFinite(lng)) markerRef.current = L.marker([lat, lng]).addTo(mapInstance.current);
                mapInstance.current.on('click', (e) => onPick({ lat: Number(e.latlng.lat.toFixed(6)), lng: Number(e.latlng.lng.toFixed(6)) }));
                setTimeout(() => mapInstance.current.invalidateSize(), 100);
                return () => { mapInstance.current && mapInstance.current.remove(); mapInstance.current = null; markerRef.current = null; };
            }, []);

            useEffect(() => {
                if (!mapInstance.current || !Number.isFinite(lat) || !Number.isFinite(lng)) return;
                if (markerRef.current) markerRef.current.setLatLng([lat, lng]);
                else markerRef.current = L.marker([lat, lng]).addTo(mapInstance.current);
            }, [lat, lng]);

            return (
                <div>
                    <label className="text-[9px] font-bold text-earth-500 mb-1 block">在地圖上點一下即可設定位置</label>
                    <div ref={mapRef} className="h-40 w-full rounded-btn border border-earth-200 overflow-hidden relative z-0"></div>
                </div>
            );
        };

        // Separate from the name search above: lets the user paste a full mailing address
        // (street/city/country) when the place has no findable name, without overwriting
        // the spot's title — it only ever fills in lat/lng.
        const AddressGeocodeInput = ({ onPick, onAddress, initialValue = '', autoSearch = false }) => {
            const [address, setAddress] = useState(initialValue);
            const [status, setStatus] = useState('');
            const [results, setResults] = useState([]);

            // Nominatim's free-text search often fails on unspaced CJK addresses (it can't tell
            // where one administrative unit ends and the next begins), so insert spaces after the
            // common unit characters before querying — this alone fixes many "查無此地址" cases.
            const spaceOutAddress = (raw) => raw.replace(/([都道府県省市區区縣县鄉乡鎮镇村路街道巷弄號号樓楼F棟])(?=\S)/g, '$1 ').replace(/\s+/g, ' ').trim();

            const runQuery = async (q) => {
                return searchPlace(q, undefined, true);
            };

            const search = async (overrideValue) => {
                const raw = (overrideValue ?? address).trim();
                if (!raw) return;
                setStatus('搜尋中…'); setResults([]);
                let usedFallback = false;
                try {
                    let items = await runQuery(spaceOutAddress(raw));
                    // Exact address had no match — retry with the address's broader/left portion
                    // (drop the last comma-separated or trailing house-number segment) so we can at
                    // least drop a pin near the right area instead of nothing at all.
                    if (!items.length) {
                        const loosened = spaceOutAddress(raw).replace(/[\d\-–—號号F棟]+\s*$/u, '').trim();
                        if (loosened && loosened !== spaceOutAddress(raw)) {
                            items = await runQuery(loosened);
                            usedFallback = items.length > 0;
                        }
                    }
                    setResults(items);
                    if (items.length === 0) setStatus('查無此地址，可嘗試簡化地址（例如省略樓層/門牌號）或直接輸入座標');
                    else setStatus(usedFallback ? '查無精確地址，以下為附近的概略位置：' : '');
                } catch (e) {
                    setStatus(e.message === 'rate-limited' ? '查詢過於頻繁，請稍候幾秒後再試一次' : '搜尋服務暫時無法連線，可先儲存地址，稍後再定位');
                }
            };

            useEffect(() => {
                if (!autoSearch || !initialValue || initialValue.trim().length < 2) return;
                setAddress(initialValue);
                search(initialValue);
            }, [autoSearch]);

            return (
                <div>
                    <label className="text-[9px] font-bold text-earth-500 mb-0.5 block">輸入地址搜尋座標</label>
                    <div className="flex gap-1.5">
                        <input type="text" value={address} onChange={e => setAddress(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); search(); } }} placeholder="例如：東京都新宿區歌舞伎町1-19-1（可省略門牌試試）" className="flex-1 min-w-0 bg-white border border-earth-200 rounded py-1.5 px-2 text-xs"/>
                        <button type="button" onClick={search} className="shrink-0 px-3 rounded bg-earth-700 text-white text-[10px] font-bold hover:bg-earth-800">搜尋</button>
                    </div>
                    {onAddress && <button type="button" onClick={() => { const value = address.trim(); if (!value) return; onAddress(value); setStatus('已記錄地址；之後可用地圖導航解析此地址'); }} className="mt-1.5 w-full py-1.5 rounded border border-accent/40 bg-accent/5 text-accent text-[10px] font-bold hover:bg-accent/10"><i className="fa-solid fa-location-dot mr-1"></i>直接使用這個地址（不需座標）</button>}
                    {status && <div className="mt-1 text-[9px] text-earth-500 font-bold">{status}</div>}
                    {results.length > 0 && (
                        <div className="mt-1.5 space-y-1">
                            {results.map((r, i) => (
                                <button type="button" key={i} onClick={() => { onPick(r); setResults([]); setStatus(`已定位：${r.detail}`); }} className="w-full text-left px-2 py-1.5 rounded bg-white border border-earth-200 hover:bg-accent/10 text-[9px] text-earth-700 leading-snug">{r.detail}</button>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const PlaceAutocompleteInput = ({ value, onChange, onPick, onNotFound, knownPlaces=[], retryKey=0 }) => {
            const [results, setResults] = useState([]);
            const [status, setStatus] = useState('');
            const [isOpen, setIsOpen] = useState(false);
            
            useEffect(() => {
                if (!isOpen) return;
                const keyword = (value || '').trim();
                if (keyword.length < 2) { setResults([]); setStatus(''); return; }
                const localMatches = knownPlaces.filter(spot => spot.lat != null && spot.lng != null && [spot.title,spot.subtitle,spot.address].some(text => String(text || '').toLocaleLowerCase().includes(keyword.toLocaleLowerCase()))).slice(0,5).map(spot => ({ name:spot.title.replace(/｜.*$/, ''), detail:spot.address || spot.subtitle || '旅程中已儲存的地點', lat:Number(spot.lat), lng:Number(spot.lng) }));
                if (localMatches.length) { setResults(localMatches); setStatus('旅程中已儲存的地點，也在搜尋其他結果…'); }
                
                const controller = new AbortController();
                // 延長防抖時間，避免輸入過快導致 API 拒絕連線
                const timer = setTimeout(async () => {
                    setStatus('搜尋中…');
                    try {
                        const items = await searchPlace(keyword, controller.signal);
                        
                        const combined = [...localMatches, ...items.filter(item => !localMatches.some(local => Math.abs(local.lat-item.lat)<0.0001 && Math.abs(local.lng-item.lng)<0.0001))].slice(0,8);
                        setResults(combined);
                        setStatus(combined.length ? (localMatches.length ? '旅程中已儲存的地點與搜尋結果' : '') : '找不到相符地點，請使用下方其他搜尋方式');
                        if (!combined.length && onNotFound) onNotFound();
                    } catch (error) { 
                        if (error.name !== 'AbortError') { 
                            setResults([]); 
                            setStatus('搜尋服務暫時無法連線，可直接使用地址'); 
                            if (onNotFound) onNotFound();
                        } 
                    }
                }, 600);
                return () => { clearTimeout(timer); controller.abort(); };
            }, [value, isOpen, retryKey]);

            return (
                <div className="relative">
                    <input type="text" value={value} onChange={e => { onChange(e.target.value); setIsOpen(true); }} onFocus={() => setIsOpen(true)} className="w-full bg-white border border-earth-200 rounded-btn py-1.5 px-2 text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-accent" required placeholder="輸入景點或地址..." />
                    {isOpen && (value || '').trim().length >= 2 && (
                        <>
                            <button type="button" tabIndex="-1" onClick={() => setIsOpen(false)} className="fixed inset-0 z-20 cursor-default"></button>
                            <div className="absolute z-30 mt-1 w-full bg-white rounded-btn border border-earth-200 shadow-float max-h-48 overflow-y-auto scrollbar-hide">
                                {status && <div className="px-2.5 py-2 text-[10px] text-earth-500 font-bold bg-earth-50"><i className="fa-solid fa-magnifying-glass-location text-accent mr-1"></i>{status}</div>}
                                {results.map((item, index) => (
                                    <button type="button" key={`${item.magicKey || `${item.lat}-${item.lng}`}-${index}`} onClick={async () => { try { setStatus('正在確認地點位置…'); const place = await resolveSuggestedPlace(item); onChange(place.name); onPick(place); setIsOpen(false); } catch (error) { setStatus(error.message || '這個候選地點暫無位置，請選其他結果'); } }} className="w-full px-2.5 py-2 text-left bg-white border-t border-earth-100 hover:bg-accent/10"><div className="text-[11px] font-bold text-earth-800">{item.name}</div><div className="mt-0.5 text-[9px] text-earth-500 truncate">{item.detail}</div></button>
                                ))}
                            </div>
                        </>
                    )}
                </div>
            );
        };

        const regionalMapLinks = (query, country='') => {
            const q = encodeURIComponent(String(query || '').trim());
            const services = [
                { name:'Google Maps', url:`https://www.google.com/maps/search/?api=1&query=${q}`, region:'global' },
                { name:'OpenStreetMap', url:`https://www.openstreetmap.org/search?query=${q}`, region:'global' },
                { name:'Apple Maps', url:`https://maps.apple.com/?q=${q}`, region:'global' },
                { name:'Naver Map', url:'https://map.naver.com/p/', region:'korea', copy:true },
                { name:'KakaoMap', url:`https://map.kakao.com/link/search/${q}`, region:'korea' },
                { name:'Japan Travel by NAVITIME', url:'https://japantravel.navitime.com/en/area/jp/', region:'japan', copy:true },
                { name:'Yandex Maps', url:`https://yandex.com/maps/?text=${q}`, region:'yandex' },
                { name:'Yandex Navigator（手機）', url:'yandexnavi://', region:'yandex', copy:true },
                { name:'高德地圖 Amap', url:'https://www.amap.com/', region:'china', copy:true },
                { name:'百度地圖', url:'https://map.baidu.com/', region:'china', copy:true }
            ];
            const region = /韓|Korea/i.test(country) ? 'korea' : /日|Japan/i.test(country) ? 'japan' : /中|China/i.test(country) ? 'china' : /俄|Russia|土耳其|Turkey|Türkiye/i.test(country) ? 'yandex' : 'global';
            return services.sort((a,b) => Number(b.region === region) - Number(a.region === region));
        };
        const parseSharedMapLink = (raw) => {
            const url = new URL(raw.trim());
            const host = url.hostname.toLowerCase();
            const allowedDomains = ['goo.gl','naver.com','naver.me','kakao.com','navitime.com','yandex.com','yandex.com.tr','yandex.ru','yandex.kz','yandex.by','yandex.uz','openstreetmap.org','apple.com','amap.com','baidu.com'];
            const isGoogle = /(^|\.)google\.(com(?:\.[a-z]{2})?|co\.[a-z]{2}|[a-z]{2,3})$/.test(host);
            if (!isGoogle && !allowedDomains.some(domain => host === domain || host.endsWith('.' + domain))) throw new Error('請貼上支援的地圖分享連結');
            const decoded = decodeURIComponent(url.href);
            const match = pattern => decoded.match(pattern);
            const google = match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/) || match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
            const kakao = host.includes('kakao.com') && match(/\/link\/(?:map|to)\/(?:[^/,]+,)?(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
            const osm = host.includes('openstreetmap.org') && match(/#map=\d+\/(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)/);
            const pair = ['q','query','ll','pt','c'].map(key => url.searchParams.get(key) || '').find(value => /^-?\d+(?:\.\d+)?,-?\d+(?:\.\d+)?/.test(value)) || '';
            const pairMatch = pair.match(/^(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
            const lat = google?.[1] || kakao?.[1] || osm?.[1] || url.searchParams.get('mlat') || url.searchParams.get('lat') || (pairMatch && !(host.includes('yandex') || host.includes('naver')) ? pairMatch[1] : pairMatch?.[2]);
            const lng = google?.[2] || kakao?.[2] || osm?.[2] || url.searchParams.get('mlon') || url.searchParams.get('lng') || url.searchParams.get('lon') || (pairMatch && !(host.includes('yandex') || host.includes('naver')) ? pairMatch[2] : pairMatch?.[1]);
            const name = url.searchParams.get('query') || url.searchParams.get('q') || url.searchParams.get('text') || match(/\/place\/([^/?]+)/)?.[1]?.replace(/\+/g,' ') || '';
            return { url:url.href, name, lat:lat == null ? null : Number(lat), lng:lng == null ? null : Number(lng) };
        };
        const PlaceFallback = ({ title, address, lat, lng, country='', onPick, onAddress, onStoreLink, onRetry }) => {
            const [method, setMethod] = useState('address');
            const [mapsUrl, setMapsUrl] = useState('');
            const [candidate, setCandidate] = useState(null);
            const [message, setMessage] = useState('');
            const resolveMapsUrl = async () => {
                setMessage(''); setCandidate(null);
                try {
                    const parsed = parseSharedMapLink(mapsUrl);
                    if (onStoreLink) onStoreLink(parsed.url);
                    if (Number.isFinite(parsed.lat) && Number.isFinite(parsed.lng) && Math.abs(parsed.lat) <= 90 && Math.abs(parsed.lng) <= 180) setCandidate({ name:title || parsed.name || '地圖位置', detail:address || parsed.name || '', lat:parsed.lat, lng:parsed.lng, mapUrl:parsed.url });
                    else if (parsed.name && !/^-?\d+(?:\.\d+)?,-?\d+(?:\.\d+)?$/.test(parsed.name)) {
                        const results = await searchPlace(parsed.name, undefined, true);
                        if (results.length) setCandidate({ ...results[0], name:title || results[0].name, mapUrl:parsed.url });
                        else setMessage('已保存地圖連結，但無法自動取得座標；可改用完整地址搜尋。');
                    } else setMessage('已保存地圖連結。短網址或只有地點 ID 的連結無法在瀏覽器內讀出位置，請貼完整地址以便計算路線。');
                } catch (error) { setMessage(error.message || '連結無法辨識，請改用其他搜尋方式。'); }
            };
            return <div className="col-span-2 rounded-btn border border-earth-200 bg-earth-50 p-2.5 space-y-2">
                <div className="text-[10px] font-bold text-earth-600">找不到地點？選擇其他方式</div>
                <div className="grid grid-cols-2 gap-2">{[['retry','重新搜尋'],['address','地址搜尋'],['link','貼上地圖分享連結'],['map','地圖選點'],['manual','手動新增']].map(([key,label]) => <button type="button" key={key} onClick={() => { setMethod(key); if (key === 'retry') onRetry(); }} className="min-h-10 rounded-btn border border-earth-200 bg-white px-2 text-[11px] font-bold text-earth-700 text-left">{label}</button>)}</div>
                <details className="rounded-btn border border-earth-200 bg-white p-2"><summary className="min-h-10 flex items-center text-[11px] font-bold text-earth-700 cursor-pointer">依國家到其他地圖搜尋</summary><p className="mb-2 text-[10px] text-earth-500">先用當地地圖確認地點；回來貼分享連結或完整地址。這些連結不會把第三方搜尋結果自動匯入。</p><div className="grid grid-cols-2 gap-2">{regionalMapLinks(title || address, country).map(service=><a key={service.name} href={service.url} target="_blank" rel="noopener noreferrer" onClick={() => { if (service.copy) { setMessage(`請在 ${service.name} 搜尋「${title || address || '地點名稱'}」`); if (navigator.clipboard?.writeText) navigator.clipboard.writeText(title || address || '').then(()=>setMessage(`已複製搜尋詞，可貼到 ${service.name}`)).catch(()=>{}); } }} className="min-h-10 flex items-center rounded-btn border border-earth-200 px-2 text-[11px] font-bold text-earth-700">{service.name} ↗</a>)}</div></details>
                {method === 'address' && <AddressGeocodeInput initialValue={address || title} onPick={onPick} onAddress={onAddress} />}
                {method === 'link' && <div className="space-y-2"><div className="flex gap-2"><input type="url" value={mapsUrl} onChange={e=>setMapsUrl(e.target.value)} placeholder="貼上 Google／Naver／Kakao／Yandex 等分享連結" className="min-w-0 flex-1 rounded-btn border border-earth-200 px-2 text-xs"/><button type="button" onClick={resolveMapsUrl} className="min-h-10 px-3 rounded-btn bg-earth-800 text-white text-xs">解析</button></div>{candidate && <div className="text-[11px] text-earth-700 break-words"><strong>{candidate.name}</strong><br/>{candidate.detail}<br/>{candidate.lat.toFixed(5)}, {candidate.lng.toFixed(5)}<button type="button" onClick={()=>onPick(candidate)} className="block mt-2 min-h-10 px-3 bg-accent text-white rounded-btn">確認使用此地點</button></div>}</div>}
                {message && <p className="text-[11px] text-earth-600">{message}</p>}
                {method === 'map' && <div><MapPinPicker lat={lat} lng={lng} onPick={(place)=>setCandidate({ ...place, name:title || '地圖選點', detail:address || '' })}/>{candidate && <button type="button" onClick={()=>onPick(candidate)} className="mt-2 min-h-10 px-3 bg-accent text-white rounded-btn text-xs">確認位置：{candidate.lat.toFixed(5)}, {candidate.lng.toFixed(5)}</button>}</div>}
                {method === 'manual' && <div className="space-y-2"><input value={address || ''} onChange={e=>onAddress(e.target.value)} placeholder="完整地址（可先儲存，稍後定位）" className="w-full min-h-10 rounded-btn border border-earth-200 px-2 text-xs"/><p className="text-[10px] text-earth-500">地點名稱及外語名稱可直接在上方填寫；地址可用於外部導航。</p></div>}
            </div>;
        };

        const CUSTOM_MODULE_DEFINITIONS = [['business','營業時間'],['ticket','票價設定'],['reservation','預約資訊'],['stay','停留時間'],['meeting','集合資訊'],['contact','聯絡資訊']];
        const CustomFieldComposer = ({ formData, setFormData }) => {
            const [dragIndex,setDragIndex]=useState(null);
            const legacyLayout = [
                ...(formData.customModules||[]).map(key=>({id:`module-${key}`,kind:'module',key})),
                ...(formData.customFields||[]).map(field=>({id:field.id||`field-${Math.random()}`,kind:'field',field}))
            ];
            const layout=formData.customLayout?.length?formData.customLayout:legacyLayout;
            const saveLayout=next=>setFormData(current=>({...current,customLayout:next,customModules:next.filter(item=>item.kind==='module').map(item=>item.key),customFields:next.filter(item=>item.kind==='field').map(item=>item.field)}));
            const data=formData.customModuleData||{};

yTotal(vehicleCosts).toFixed(2)}</span></div></div>}

                                <div className="col-span-2"><label className="text-[10px] font-bold text-earth-500 mb-1 block">備註</label><input name="remark" value={formData.remark||''} onChange={handleChange} className="w-full bg-white border border-earth-200 rounded-btn py-1.5 px-2 text-xs"/></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const BillsView = ({ activeData, updateData, updateMeta, updateCompanions, formatCurrency }) => {
            const [editing, setEditing] = useState(null);
            const [showCompanionManager, setShowCompanionManager] = useState(false);
            const [showSettlement, setShowSettlement] = useState(false);
            const [selectedPerson, setSelectedPerson] = useState(null);
            const [openBillId,setOpenBillId]=useState(null);
            const billTouchStart=useRef(0);
            const bills = activeData.bills;
            const companions = Array.from(new Set(['我', ...(activeData.companions || [])]));
            const symbol = activeData.info.currencySymbol;
            const ntAmount = (amount) => `NT$ ${(Number(amount || 0) * Number(activeData.info.exchangeRate || 1)).toFixed(2)}`;
            const localAmount = (amount) => `${symbol} ${Number(amount || 0).toFixed(2)}`;
            const formatPersonTotal = (amount) => `${ntAmount(amount)} · ${localAmount(amount)}`;
            const billPayers = (bill) => {
                if (Array.isArray(bill.payers) && bill.payers.length) return bill.payers;
                return bill.payer ? [{ person: bill.payer, amount: Number(bill.amount || 0) }] : [];
            };
            const total = bills.reduce((sum, b) => sum + Number(b.amount || 0), 0);
            const paidByPerson = companions.reduce((acc, c) => {
                acc[c] = bills.reduce((sum, b) => sum + billPayers(b).filter(p => p.person === c).reduce((s, p) => s + Number(p.amount || 0), 0), 0);
                return acc;
            }, {});
            const netBalances = companions.reduce((acc, person) => { acc[person] = paidByPerson[person] || 0; return acc; }, {});
            bills.forEach(bill => {
                const splitWith = (bill.splitWith || []).filter(person => companions.includes(person));
                if (!splitWith.length) return;
                const share = Number(bill.amount || 0) / splitWith.length;
                splitWith.forEach(person => { netBalances[person] -= share; });
            });
            const personPaid = selectedPerson ? (paidByPerson[selectedPerson] || 0) : 0;
            const personOwed = selectedPerson ? bills.reduce((sum, bill) => {
                const people = (bill.splitWith || []).filter(person => companions.includes(person));
                return sum + (people.includes(selectedPerson) && people.length ? Number(bill.amount || 0) / people.length : 0);
            }, 0) : 0;
            const personBalance = personPaid - personOwed;
            const visibleBills = selectedPerson ? bills.filter(b => (b.splitWith || []).includes(selectedPerson) || billPayers(b).some(p => p.person === selectedPerson)) : bills;
            const creditors = companions.filter(person => netBalances[person] > 0.01).map(person => ({ person, amount: netBalances[person] }));
            const debtors = companions.filter(person => netBalances[person] < -0.01).map(person => ({ person, amount: -netBalances[person] }));
            const settlements = [];
            let creditorIndex = 0;
            debtors.forEach(debtor => {
                let remaining = debtor.amount;
                while (remaining > 0.01 && creditors[creditorIndex]) {
                    const creditor = creditors[creditorIndex], amount = Math.min(remaining, creditor.amount);
                    settlements.push({ from: debtor.person, to: creditor.person, amount });
                    remaining -= amount; creditor.amount -= amount;
                    if (creditor.amount <= 0.01) creditorIndex++;
                }
            });
            const paymentInfo = activeData.paymentInfo || '';
            const summaryText = `${activeData.info.title}｜分帳結算\n總花費：${ntAmount(total)}（${localAmount(total)}）\n\n${settlements.length ? settlements.map(s => `${s.from} → ${s.to}：${ntAmount(s.amount)}（${localAmount(s.amount)}）`).join('\n') : '目前已結清，無需轉帳。'}${paymentInfo ? `\n\n轉帳資訊：${paymentInfo}` : ''}`;
            const shareSummary = async () => {
                if (navigator.share) { try { await navigator.share({ title: `${activeData.info.title} 分帳結算`, text: summaryText }); } catch (e) {} return; }
                try { await navigator.clipboard.writeText(summaryText); alert('結算單已複製，可直接貼到 LINE 或訊息中傳送。'); } catch (e) { alert(summaryText); }
            };
            const sendSettlement = (settlement) => window.open(`https://line.me/R/msg/text/?${encodeURIComponent(`${activeData.info.title}｜轉帳提醒\n${settlement.from} 請轉帳 ${ntAmount(settlement.amount)} 給 ${settlement.to}${paymentInfo ? `\n\n轉帳資訊：${paymentInfo}` : ''}`)}`, '_blank');
            const setBillPayer = (billId, person) => updateData(bills.map(b => {
                if (b.id !== billId) return b;
                const current = billPayers(b).map(p => p.person);
                const nextPeople = current.includes(person) ? current.filter(p => p !== person) : [...current, person];
                const people = nextPeople.length ? nextPeople : ['我'];
                return { ...b, payer: people[0], payers: people.map(p => ({ person: p, amount: Number(b.amount || 0) / people.length })) };
            }));
            const editingPayerPeople = editing ? (Array.isArray(editing.payers) && editing.payers.length ? editing.payers.map(p => p.person) : [editing.payer || '我']) : [];
            const toggleEditingPayer = (person) => {
                if (!editing) return;
                const next = editingPayerPeople.includes(person) ? editingPayerPeople.filter(p => p !== person) : [...editingPayerPeople, person];
                const people = next.length ? next : ['我'];
                setEditing({ ...editing, payer: people[0], payers: people.map(p => ({ person: p, amount: Number(editing.amount || 0) / people.length })) });
            };
            const toggleBillPerson = (billId, person) => updateData(bills.map(b => { if (b.id !== billId) return b; const current = b.splitWith || []; return { ...b, splitWith: current.includes(person) ? current.filter(x => x !== person) : [...current, person] }; }));
            const deleteBill = (bill) => {
                const remaining = bills.filter(x => x.id !== bill.id);
                if (bill.sourceSpotId) updateMeta({ bills: remaining, deletedBillSourceIds: [...(activeData.deletedBillSourceIds || []), bill.sourceSpotId] });
                else if (bill.sourceFlightId) updateMeta({ bills: remaining, deletedFlightBillSourceIds: [...(activeData.deletedFlightBillSourceIds || []), bill.sourceFlightId] });

                        </div>
                    </div>
                        <div className="rounded-card border border-earth-100 bg-earth-100/80 p-2.5 flex gap-3 overflow-x-auto scrollbar-hide relative z-10 shadow-sm">

                                    <div className="text-[9px] text-earth-500 font-bold">{c} 已付</div>
                                    <div><div className="text-[12px] font-black">{ntAmount(paidByPerson[c] || 0)}</div><div className="text-[9px] font-normal text-earth-400">{localAmount(paidByPerson[c] || 0)}</div></div>
                                </button>
                            ))}
                            <button type="button" onClick={() => setShowCompanionManager(true)} className="ml-auto shrink-0 flex flex-col items-center justify-center px-2 text-earth-600 opacity-80 hover:opacity-100 transition border-l border-earth-300 pl-2.5"><i className="fa-solid fa-users-gear text-[10px] mb-0.5"></i><span className="text-[9px]">管理人員</span></button>
                        </div>
                    {selectedPerson && <><div className="flex items-center justify-between"><h3 className="text-sm font-bold text-earth-800">{selectedPerson} 的個人明細</h3><button type="button" onClick={() => setSelectedPerson(null)} className="min-h-9 px-2 text-xs text-earth-500">查看全部</button></div><div className="grid grid-cols-2 gap-1.5"><div className="bg-white rounded-btn p-2"><div className="text-[10px] text-earth-500">個人總花費</div><div className="text-sm font-black text-earth-900 break-words">{ntAmount(personOwed)}</div><div className="text-[9px] text-earth-400">{localAmount(personOwed)}</div></div><div className="bg-white rounded-btn p-2"><div className="text-[10px] text-earth-500">已付款</div><div className="text-sm font-black text-earth-800 break-words">{ntAmount(personPaid)}</div><div className="text-[9px] text-earth-400">{localAmount(personPaid)}</div></div><div className="bg-white rounded-btn p-2"><div className="text-[10px] text-earth-500">應分攤</div><div className="text-sm font-black text-red-800 break-words">{ntAmount(personOwed)}</div><div className="text-[9px] text-earth-400">{localAmount(personOwed)}</div></div><div className="bg-white rounded-btn p-2"><div className="text-[10px] text-earth-500">應收回</div><div className="text-sm font-black text-green-600 break-words">{ntAmount(Math.max(0, personBalance))}</div><div className="text-[9px] text-earth-400">{localAmount(Math.max(0, personBalance))}</div></div></div></>}
                    <button onClick={() => setEditing({ title: '', category: '飲食', amount: '', payer: '我', payers: [{ person: '我', amount: 0 }], splitWith: [...companions] })} className="w-full py-2.5 border-2 border-dashed border-accent/50 rounded-card text-accent text-xs font-bold flex items-center justify-center gap-1.5 bg-white hover:bg-accent hover:text-white transition shadow-sm">
                        <i className="fa-solid fa-plus"></i> 新增記帳分帳
                    </button>
                    {visibleBills.map(b => {
